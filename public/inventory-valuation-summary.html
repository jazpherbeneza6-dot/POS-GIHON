<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Valuation Summary - Reports</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/report-export.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', 'Source Sans Pro', Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f6fa;
            font-size: 13px;
        }

        .main-layout {
            display: flex;
            min-height: 100vh;
        }

        .content {
            flex: 1;
            margin-left: 260px;
            padding: 0;
            background: #fff;
        }

        /* ===== TOP HEADER BAR ===== */
        .report-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            min-height: 44px;
        }

        .report-top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hamburger-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #555;
            padding: 4px 8px;
        }

        .breadcrumb-area {
            display: flex;
            flex-direction: column;
        }

        .breadcrumb-category {
            font-size: 11px;
            color: #999;
        }

        .breadcrumb-title {
            font-size: 15px;
            font-weight: 600;
            color: #222;
        }

        .breadcrumb-date {
            font-size: 11px;
            color: #999;
            font-weight: 400;
            margin-left: 6px;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-bar-actions button {
            background: none;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 14px;
            color: #555;
        }

        .top-bar-actions button:hover {
            background: #f5f5f5;
        }

        .btn-export {
            font-size: 12px !important;
            font-weight: 500;
        }

        .btn-close-report {
            color: #e53935 !important;
            font-weight: bold;
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            background: #f9fafb;
            border-bottom: 1px solid #e8e8e8;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
        }

        .filter-dropdown {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 12px;
            color: #333;
        }

        .filter-dropdown select {
            border: none;
            outline: none;
            font-size: 12px;
            color: #2563eb;
            font-weight: 500;
            cursor: pointer;
            background: transparent;
        }

        .filter-more {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 5px 12px;
            font-size: 12px;
            color: #2563eb;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-run-report {
            background: #e53935;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 7px 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-run-report:hover {
            background: #c62828;
        }

        /* ===== OPTIONS BAR ===== */
        .options-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 20px;
            padding: 8px 20px;
            background: #fff;
            border-bottom: 1px solid #eee;
            font-size: 12px;
            color: #555;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .option-bold {
            font-weight: 600;
            color: #333;
        }

        .customize-count {
            background: #2563eb;
            color: #fff;
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 10px;
            font-weight: 700;
            margin-left: 4px;
        }

        /* ===== REPORT BODY ===== */
        .report-body {
            padding: 30px 20px 60px;
            overflow-x: auto;
        }

        .report-header-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .company-name {
            font-size: 13px;
            color: #888;
            margin-bottom: 4px;
        }

        .report-main-title {
            font-size: 17px;
            font-weight: 700;
            color: #222;
        }

        .report-date-range {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }

        .date-highlight {
            color: #2563eb;
            font-weight: 500;
        }

        /* ===== REPORT TABLE ===== */
        .report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 700px;
        }

        .report-table thead th {
            text-align: left;
            font-size: 10px;
            font-weight: 700;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            padding: 10px 10px;
            border-bottom: 2px solid #ddd;
            background: #fafafa;
            white-space: nowrap;
        }

        .report-table tbody td {
            padding: 10px 10px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
            white-space: nowrap;
        }

        .report-table tfoot td {
            padding: 10px 10px;
            font-weight: 700;
            border-top: 2px solid #ddd;
            background: #fafafa;
            color: #222;
        }

        .report-table tbody tr:hover {
            background: #f8f9ff;
        }

        .align-right {
            text-align: right !important;
        }

        .align-center {
            text-align: center !important;
        }

        .item-link {
            color: #2563eb;
            cursor: pointer;
        }

        .item-link:hover {
            text-decoration: underline;
        }

        .unit-label {
            color: #999;
            font-size: 11px;
            margin-left: 3px;
        }

        .asset-value {
            color: #2563eb;
        }
    </style>
</head>

<body>
    <div id="sidebarContainer"></div>

    <div class="main-layout">
        <div class="content" id="content">

            <!-- TOP HEADER BAR -->
            <div class="report-top-bar">
                <div class="report-top-left">
                    <button class="hamburger-btn" onclick="window.location.href='/reports.html'">☰</button>
                    <div class="breadcrumb-area">
                        <span class="breadcrumb-category">Inventory Valuation</span>
                        <span class="breadcrumb-title">
                            Inventory Valuation Summary
                            <span class="breadcrumb-date" id="breadcrumbDate">•</span>
                        </span>
                    </div>
                </div>
                <div class="top-bar-actions">
                    <button title="Schedule"><span>📅</span></button>
                    <button title="Refresh" onclick="runReport()"><span>🔄</span></button>
                    <button title="Share"><span>📤</span></button>
                    <button class="btn-export" title="Export">Export ▾</button>
                    <button title="Print" onclick="window.print()"><span>🖨</span></button>
                    <button class="btn-close-report" title="Close"
                        onclick="window.location.href='/reports.html'">✕</button>
                </div>
            </div>

            <!-- FILTER BAR -->
            <div class="filter-bar">
                <span class="filter-label">🔽 Filters :</span>

                <div class="filter-dropdown">
                    <span>As of :</span>
                    <select id="asOfSelect" onchange="handleFilterChange()" title="As of">
                        <option value="today" selected>Today</option>
                    </select>
                </div>

                <div class="filter-dropdown">
                    <span>Stock Availability :</span>
                    <select id="stockFilterSelect" onchange="handleFilterChange()" title="Stock Availability">
                        <option value="all" selected>No criteria</option>
                        <option value="in_stock">In Stock</option>
                        <option value="out_of_stock">Out of Stock</option>
                    </select>
                </div>

                <div class="filter-dropdown">
                    <span>Status :</span>
                    <select id="statusSelect" title="Status">
                        <option value="all" selected>All</option>
                    </select>
                </div>

                <button class="filter-more">⊕ More Filters</button>

                <button class="btn-run-report" onclick="runReport()">Run Report</button>
            </div>

            <!-- OPTIONS BAR -->
            <div class="options-bar">
                <div class="option-item">
                    <span>📁</span>
                    Group By : <span class="option-bold">None</span> ▾
                </div>
                <div class="option-item">
                    <span>⚙️</span>
                    Customize Report Columns
                    <span class="customize-count">4</span>
                </div>
            </div>

            <!-- REPORT BODY -->
            <div class="report-body">
                <div class="report-header-section">
                    <div class="company-name">SOLO</div>
                    <div class="report-main-title">Inventory Valuation Summary</div>
                    <div class="report-date-range" id="reportDateRange">
                        As of <span class="date-highlight" id="asOfDateDisplay">-</span>
                    </div>
                </div>

                <table class="report-table">
                    <thead>
                        <tr>
                            <th>ITEM NAME ⇅</th>
                            <th class="align-right">STOCK ON HAND</th>
                            <th class="align-right">INVENTORY ASSET VALUE</th>
                            <th>SKU</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody">
                        <tr>
                            <td colspan="4" class="align-center" id="loadingCell">Loading...</td>
                        </tr>
                    </tbody>
                    <tfoot id="reportTableFoot">
                        <tr>
                            <td><strong>Total</strong></td>
                            <td class="align-right" id="totStock"></td>
                            <td class="align-right" id="totAssetValue"></td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

        </div>
    </div>

    <script src="/js/layout.js"></script>
    <script src="/js/report-export.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            runReport();
        });

        function fmtDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function fmtNum(val) {
            return parseFloat(val).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function fmtCurrency(val) {
            return 'PHP' + parseFloat(val).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function handleFilterChange() {
            runReport();
        }

        async function runReport() {
            const tbody = document.getElementById('reportTableBody');
            const tfoot = document.getElementById('reportTableFoot');
            tbody.innerHTML = '<tr><td colspan="4" class="align-center" id="loadingCell">Loading...</td></tr>';
            tfoot.style.display = 'none';

            const today = new Date();
            const todayStr = fmtDate(today.toISOString().split('T')[0]);
            document.getElementById('asOfDateDisplay').textContent = todayStr;
            document.getElementById('breadcrumbDate').textContent = `• As of ${todayStr}`;

            const stockFilter = document.getElementById('stockFilterSelect').value;

            try {
                let url = '/api/inventory/reports/inventory-valuation-summary';
                if (stockFilter && stockFilter !== 'all') {
                    url += `?stock_filter=${stockFilter}`;
                }

                const res = await fetch(url);
                if (!res.ok) throw new Error('API error');
                const data = await res.json();

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="align-center" id="emptyCell">No items found.</td></tr>';
                    return;
                }

                let totStock = 0, totAssetValue = 0;

                tbody.innerHTML = data.map(row => {
                    totStock += row.stock_on_hand;
                    totAssetValue += row.asset_value;

                    return `
                        <tr>
                            <td><span class="item-link">${row.item_name}</span> <span class="unit-label">(${row.unit})</span></td>
                            <td class="align-right">${fmtNum(row.stock_on_hand)}</td>
                            <td class="align-right asset-value">${fmtCurrency(row.asset_value)}</td>
                            <td>${row.sku}</td>
                        </tr>
                    `;
                }).join('');

                document.getElementById('totStock').textContent = fmtNum(totStock);
                document.getElementById('totAssetValue').textContent = fmtCurrency(totAssetValue);
                tfoot.style.display = '';

            } catch (e) {
                console.error('Error:', e);
                tbody.innerHTML = '<tr><td colspan="4" class="align-center" id="errorCell">Error loading report data.</td></tr>';
            }
        }
    </script>
</body>

</html>
