<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Sales Orders - Inventory Management</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', 'Source Sans Pro', Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f6fa;
            font-size: 13px;
        }

        .main-layout {
            display: flex;
            min-height: 100vh;
        }

        .content {
            flex: 1;
            margin-left: 260px;
            padding: 0;
            background: white;
        }

        /* Page Header */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: white;
            border-bottom: 1px solid #e9ecef;
        }

        .page-title-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .page-title:hover {
            color: #4285f4;
        }

        .dropdown-arrow {
            font-size: 10px;
            color: #666;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .view-stats-link {
            color: #4285f4;
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .view-stats-link:hover {
            text-decoration: underline;
        }

        .btn-new {
            padding: 8px 16px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-new:hover {
            background: #3367d6;
        }

        .btn-more {
            width: 36px;
            height: 36px;
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-more:hover {
            background: #f5f5f5;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 120px 24px;
            text-align: center;
        }

        .empty-state-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin: 0 0 12px 0;
        }

        .empty-state-subtitle {
            font-size: 14px;
            color: #666;
            margin: 0 0 32px 0;
            max-width: 400px;
        }

        .btn-create {
            padding: 12px 24px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-create:hover {
            background: #3367d6;
        }

        /* Sales Orders Table */
        .orders-container {
            padding: 24px;
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .orders-table th {
            text-align: left;
            padding: 14px 16px;
            font-size: 11px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e9ecef;
            background: #f9fafb;
        }

        .orders-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            color: #333;
        }
    </style>
</head>

<body>
    <!-- Sidebar Container -->
    <div id="sidebarContainer"></div>

    <div class="main-layout">
        <div class="content" id="content">
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-title-wrapper">
                    <h1 class="page-title">
                        All Sales Orders
                        <span class="dropdown-arrow">▼</span>
                    </h1>
                </div>
                <div class="header-actions">
                    <a href="#" class="view-stats-link">
                        <span>📊</span> View Order Stats
                    </a>
                    <button class="btn-new" onclick="createSalesOrder()">
                        <span>+</span> New
                    </button>
                    <button class="btn-more">⋯</button>
                </div>
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <h2 class="empty-state-title">Start Managing Your Sales Activities!</h2>
                <p class="empty-state-subtitle">Create, customize and send professional Sales Orders.</p>
                <button class="btn-create" onclick="createSalesOrder()">CREATE SALES ORDER</button>
            </div>

            <!-- Sales Orders Container (hidden when empty) -->
            <div class="orders-container" id="ordersContainer" style="display: none;">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>DATE</th>
                            <th>SALES ORDER#</th>
                            <th>REFERENCE#</th>
                            <th>CUSTOMER NAME</th>
                            <th>STATUS</th>
                            <th>AMOUNT</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody">
                        <!-- Orders will be added here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Layout Script -->
    <script src="/js/layout.js"></script>
    <script>
        // Create new sales order
        function createSalesOrder() {
            window.location.href = '/new-sales-order.html';
        }
    </script>
</body>

</html>
