<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Payment - Inventory Management</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', 'Source Sans Pro', Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f6fa;
            font-size: 12px;
        }

        .main-layout {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .content {
            flex: 1;
            margin-left: 260px;
            background: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Page Header */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: white;
            border-bottom: 1px solid #e9ecef;
            flex-shrink: 0;
        }

        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title-icon {
            font-size: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #333;
        }

        /* Main Form Area */
        .form-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-bottom: 80px;
        }

        /* Vendor Section (Blue Background) */
        .vendor-section {
            background: #e8f0fe;
            padding: 16px 24px;
            border-bottom: 1px solid #c5d9f7;
        }

        .vendor-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            align-items: center;
            gap: 16px;
        }

        .vendor-label {
            font-size: 13px;
            color: #dc2626;
        }

        .vendor-select {
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
            background: white;
            max-width: 300px;
        }

        /* Form Section */
        .form-section {
            padding: 16px 24px;
            border-bottom: 1px solid #e9ecef;
        }

        .form-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-label {
            font-size: 13px;
            color: #333;
            padding-top: 8px;
        }

        .form-label.required {
            color: #dc2626;
        }

        .form-input {
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
            width: 100%;
            max-width: 300px;
        }

        .form-input:focus {
            outline: none;
            border-color: #4285f4;
        }

        .form-select {
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
            background: white;
            cursor: pointer;
            max-width: 300px;
            width: 100%;
        }

        .input-with-icon {
            position: relative;
            display: inline-block;
            max-width: 300px;
            width: 100%;
        }

        .input-with-icon input {
            width: 100%;
            padding-right: 36px;
        }

        .input-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            cursor: pointer;
        }

        /* TDS Section */
        .tds-section {
            padding: 16px 24px;
            border-bottom: 1px solid #e9ecef;
        }

        .tds-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            align-items: center;
            gap: 16px;
        }

        .tds-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #666;
        }

        .tds-checkbox input[type="checkbox"] {
            accent-color: #4285f4;
        }

        /* Bills Table Section */
        .bills-table-section {
            padding: 16px 24px;
        }

        .section-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .clear-link {
            color: #4285f4;
            text-decoration: none;
            font-size: 13px;
        }

        .clear-link:hover {
            text-decoration: underline;
        }

        .bills-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 12px;
        }

        .bills-table th {
            text-align: left;
            padding: 10px 12px;
            font-size: 11px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            background: #f9fafb;
            border-bottom: 1px solid #e9ecef;
        }

        .bills-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            color: #333;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 14px;
        }

        /* Totals Section */
        .totals-section {
            padding: 16px 24px;
        }

        .totals-box {
            max-width: 400px;
            margin-left: auto;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 13px;
        }

        .total-row.main {
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 12px;
        }

        .amount-box {
            background: #fef2f2;
            padding: 12px 16px;
            border-radius: 4px;
            margin-top: 12px;
        }

        .amount-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
            color: #666;
        }

        .amount-row .value {
            color: #dc2626;
        }

        .amount-row.warning {
            color: #dc2626;
        }

        .amount-row.warning .label {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Notes Section */
        .notes-section {
            padding: 16px 24px;
            background: #f9fafb;
            border-top: 1px solid #e9ecef;
        }

        .notes-textarea {
            width: 100%;
            max-width: 600px;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
            background: white;
        }

        .notes-hint {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        /* Attachments Section */
        .attachments-section {
            padding: 16px 24px;
            border-top: 1px solid #e9ecef;
        }

        .attachments-label {
            font-size: 13px;
            font-weight: 500;
            color: #666;
            margin-bottom: 8px;
        }

        .upload-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
        }

        .upload-btn:hover {
            background: #f5f5f5;
        }

        /* Footer */
        .form-footer {
            position: fixed;
            bottom: 0;
            left: 260px;
            right: 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 12px 24px;
            background: white;
            border-top: 1px solid #e9ecef;
            gap: 12px;
            z-index: 100;
        }

        .btn-draft {
            padding: 10px 20px;
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-draft:hover {
            background: #f5f5f5;
        }

        .btn-save {
            padding: 10px 20px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-save:hover {
            background: #dc2626;
        }

        .btn-cancel {
            padding: 10px 20px;
            background: #e5e7eb;
            color: #333;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-cancel:hover {
            background: #d1d5db;
        }
    </style>
</head>

<body>
    <!-- Sidebar Container -->
    <div id="sidebarContainer"></div>

    <div class="main-layout">
        <div class="content" id="content">
            <!-- Page Header -->
            <div class="page-header">
                <h1 class="page-title">
                    <span class="title-icon">🏠</span>
                    Record Payment
                </h1>
                <button class="close-btn" onclick="goBack()">×</button>
            </div>

            <!-- Main Form Area -->
            <div class="form-main">
                <!-- Vendor Section (Blue) -->
                <div class="vendor-section">
                    <div class="vendor-row">
                        <label class="vendor-label">Vendor Name*</label>
                        <select class="vendor-select" id="vendorName" onchange="loadVendorBills()">
                            <option value="">Select Vendor</option>
                        </select>
                    </div>
                </div>

                <!-- Form Fields Section -->
                <div class="form-section">
                    <div class="form-row">
                        <label class="form-label required">Payment #*</label>
                        <div class="input-with-icon">
                            <input type="text" class="form-input" id="paymentNumber">
                            <span class="input-icon">ⓘ</span>
                        </div>
                    </div>

                    <div class="form-row">
                        <label class="form-label required">Payment Made*</label>
                        <input type="text" class="form-input" id="paymentMade">
                    </div>

                    <div class="form-row">
                        <label class="form-label required">Payment Date*</label>
                        <input type="text" class="form-input" id="paymentDate" placeholder="dd MMM yyyy">
                    </div>

                    <div class="form-row">
                        <label class="form-label">Payment Mode</label>
                        <select class="form-select" id="paymentMode">
                            <option value="">Choose the payment item or type to add</option>
                            <option value="cash">Cash</option>
                            <option value="bank">Bank Transfer</option>
                            <option value="check">Check</option>
                            <option value="credit-card">Credit Card</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label class="form-label required">Paid Through*</label>
                        <select class="form-select" id="paidThrough">
                            <option value="">Select an account</option>
                            <option value="petty-cash">Petty Cash</option>
                            <option value="bank-account">Bank Account</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label class="form-label">Reference#</label>
                        <input type="text" class="form-input" id="referenceNumber">
                    </div>
                </div>

                <!-- TDS Section -->
                <div class="tds-section">
                    <div class="tds-row">
                        <label class="form-label">TDS</label>
                        <label class="tds-checkbox">
                            <input type="checkbox" id="deductTds">
                            Deduct TDS Tax
                        </label>
                    </div>
                </div>

                <!-- Bills Table Section -->
                <div class="bills-table-section">
                    <div class="section-header">
                        <a href="#" class="clear-link" onclick="clearAppliedAmount()">Clear Applied Amount</a>
                    </div>

                    <table class="bills-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Bill#</th>
                                <th>Bill Amount</th>
                                <th>Amount Due</th>
                                <th>Payment Made on ⓘ</th>
                                <th>Payment</th>
                            </tr>
                        </thead>
                        <tbody id="billsTableBody">
                            <tr>
                                <td colspan="6" class="empty-message">There are no bills for this vendor.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Totals Section -->
                <div class="totals-section">
                    <div class="totals-box">
                        <div class="total-row main">
                            <span>Total :</span>
                            <span id="total">0.00</span>
                        </div>

                        <div class="amount-box">
                            <div class="amount-row">
                                <span>Amount Paid:</span>
                                <span class="value" id="amountPaid">0</span>
                            </div>
                            <div class="amount-row">
                                <span>Amount used for Payments:</span>
                                <span class="value" id="amountUsed">0.00</span>
                            </div>
                            <div class="amount-row">
                                <span>Amount Refunded:</span>
                                <span class="value" id="amountRefunded">0</span>
                            </div>
                            <div class="amount-row warning">
                                <span class="label">⚠️ Amount in Excess:</span>
                                <span class="value" id="amountExcess">0</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Notes Section -->
                <div class="notes-section">
                    <div class="notes-hint">Notes (Internal use. Not visible to vendor)</div>
                    <textarea class="notes-textarea" id="notes" placeholder=""></textarea>
                </div>

                <!-- Attachments Section -->
                <div class="attachments-section">
                    <div class="attachments-label">Attachments</div>
                    <button class="upload-btn" onclick="attachFiles()">
                        📤 Upload File <span>▼</span>
                    </button>
                </div>
            </div>

            <!-- Footer -->
            <div class="form-footer">
                <button class="btn-draft" onclick="saveAsDraft()">Save as Draft</button>
                <button class="btn-save" onclick="saveAsPaid()">Save as Paid</button>
                <button class="btn-cancel" onclick="goBack()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Layout Script -->
    <script src="/js/layout.js"></script>
    <script>
        // Set current date
        document.addEventListener('DOMContentLoaded', function () {
            const today = new Date();
            const options = { day: '2-digit', month: 'short', year: 'numeric' };
            const dateStr = today.toLocaleDateString('en-GB', options);
            document.getElementById('paymentDate').value = dateStr;

            // Load vendors
            loadVendors();
        });

        async function loadVendors() {
            try {
                const response = await fetch('/api/vendors');
                if (response.ok) {
                    const vendors = await response.json();
                    const select = document.getElementById('vendorName');
                    vendors.forEach(vendor => {
                        const option = document.createElement('option');
                        option.value = vendor.id;
                        option.textContent = vendor.company_name || vendor.first_name + ' ' + vendor.last_name;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading vendors:', error);
            }
        }

        function loadVendorBills() {
            const vendorId = document.getElementById('vendorName').value;
            const tbody = document.getElementById('billsTableBody');

            if (!vendorId) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-message">There are no bills for this vendor.</td></tr>';
                return;
            }

            // In real app, fetch bills for vendor
            // For now, show empty state
            tbody.innerHTML = '<tr><td colspan="6" class="empty-message">There are no bills for this vendor.</td></tr>';
        }

        function goBack() {
            window.location.href = '/payments-made.html';
        }

        function clearAppliedAmount() {
            // Clear all payment inputs in the table
            const inputs = document.querySelectorAll('.bills-table input[type="number"]');
            inputs.forEach(input => input.value = 0);
            calculateTotals();
        }

        function calculateTotals() {
            // Calculate totals
            let total = 0;
            const inputs = document.querySelectorAll('.bills-table input[type="number"]');
            inputs.forEach(input => {
                total += parseFloat(input.value) || 0;
            });

            document.getElementById('total').textContent = total.toFixed(2);
            document.getElementById('amountPaid').textContent = total.toFixed(0);
            document.getElementById('amountUsed').textContent = total.toFixed(2);
        }

        function attachFiles() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.pdf,.doc,.docx,.jpg,.png';
            input.multiple = true;
            input.click();
        }

        function saveAsDraft() {
            alert('Payment saved as draft!');
            goBack();
        }

        function saveAsPaid() {
            const vendorName = document.getElementById('vendorName').value;
            const paymentNumber = document.getElementById('paymentNumber').value;
            const paymentMade = document.getElementById('paymentMade').value;

            if (!vendorName) {
                alert('Please select a vendor');
                return;
            }

            if (!paymentNumber) {
                alert('Please enter a payment number');
                return;
            }

            if (!paymentMade) {
                alert('Please enter payment made amount');
                return;
            }

            alert('Payment saved successfully!');
            goBack();
        }
    </script>
</body>

</html>
