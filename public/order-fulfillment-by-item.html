<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Fulfillment By Item - Reports</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/report-export.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', 'Source Sans Pro', Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f6fa;
            font-size: 13px;
        }

        .main-layout {
            display: flex;
            min-height: 100vh;
        }

        .content {
            flex: 1;
            margin-left: 260px;
            padding: 0;
            background: #fff;
        }

        /* ===== TOP HEADER BAR ===== */
        .report-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            min-height: 44px;
        }

        .report-top-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hamburger-btn {
            background: none;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 6px 8px;
            cursor: pointer;
            font-size: 16px;
            color: #555;
        }

        .breadcrumb-area {
            display: flex;
            flex-direction: column;
        }

        .breadcrumb-category {
            font-size: 11px;
            color: #4285f4;
            font-weight: 500;
        }

        .breadcrumb-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .breadcrumb-date {
            font-size: 12px;
            color: #888;
            font-weight: 400;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-bar-actions button {
            width: 34px;
            height: 34px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .top-bar-actions button:hover {
            background: #f5f5f5;
        }

        .btn-export {
            width: auto !important;
            padding: 0 12px;
            font-size: 12px !important;
            font-weight: 500;
            gap: 4px;
        }

        .btn-close-report {
            color: #e53935 !important;
            font-size: 18px !important;
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 12px;
            color: #555;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-dropdown {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
            font-size: 12px;
            color: #333;
            cursor: pointer;
        }

        .filter-dropdown select {
            border: none;
            background: none;
            font-size: 12px;
            color: #333;
            outline: none;
            cursor: pointer;
            font-family: inherit;
        }

        .filter-more {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #4285f4;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            background: none;
            padding: 5px 8px;
        }

        .filter-more:hover {
            text-decoration: underline;
        }

        .btn-run-report {
            padding: 7px 18px;
            background: #f4511e;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-run-report:hover {
            background: #e64a19;
        }

        /* ===== OPTIONS BAR ===== */
        .options-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 8px 20px;
            background: #f9fafb;
            border-bottom: 1px solid #e0e0e0;
            gap: 16px;
            font-size: 12px;
            color: #555;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .option-item:hover {
            color: #333;
        }

        .option-icon {
            font-size: 13px;
        }

        .option-bold {
            font-weight: 600;
            color: #333;
        }

        .customize-count {
            background: #4285f4;
            color: #fff;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* ===== REPORT BODY ===== */
        .report-body {
            padding: 0;
            background: #fff;
        }

        .report-header-section {
            text-align: center;
            padding: 32px 24px 24px;
        }

        .company-name {
            font-size: 12px;
            color: #4285f4;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .report-main-title {
            font-size: 17px;
            font-weight: 700;
            color: #333;
            margin-bottom: 6px;
        }

        .report-date-range {
            font-size: 13px;
            color: #666;
        }

        .report-date-range .date-highlight {
            color: #4285f4;
            font-weight: 600;
        }

        /* ===== DATA TABLE ===== */
        .report-table-wrapper {
            padding: 0 20px 40px;
            overflow-x: auto;
        }

        .report-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        .report-table thead th {
            text-align: left;
            padding: 12px 14px;
            font-size: 10.5px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-top: 1px solid #e0e0e0;
            border-bottom: 1px solid #e0e0e0;
            background: #fff;
            white-space: nowrap;
        }

        .report-table thead th.align-right {
            text-align: right;
        }

        .report-table thead th .sort-icon {
            font-size: 10px;
            color: #bbb;
            margin-left: 2px;
        }

        .report-table tbody td {
            padding: 13px 14px;
            font-size: 13px;
            color: #333;
            border-bottom: 1px solid #f2f2f2;
        }

        .report-table tbody td.align-right {
            text-align: right;
        }

        .report-table tbody td.value-blue {
            color: #4285f4;
        }

        .report-table tbody td.item-link {
            color: #4285f4;
            cursor: pointer;
        }

        .report-table tbody td.item-link:hover {
            text-decoration: underline;
        }

        .report-table tbody tr:hover {
            background: #fafbff;
        }

        /* Total row */
        .report-table tfoot td {
            padding: 14px 14px;
            font-size: 13px;
            font-weight: 700;
            color: #333;
            border-top: 2px solid #e0e0e0;
        }

        .report-table tfoot td.align-right {
            text-align: right;
        }

        /* Breadcrumb links */
        .breadcrumb-category a {
            color: #4285f4;
            text-decoration: none;
        }

        .breadcrumb-category a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div id="sidebarContainer"></div>

    <div class="main-layout">
        <div class="content" id="content">

            <!-- TOP HEADER BAR -->
            <div class="report-top-bar">
                <div class="report-top-left">
                    <button class="hamburger-btn" onclick="window.location.href='/reports.html'">☰</button>
                    <div class="breadcrumb-area">
                        <span class="breadcrumb-category" id="breadcrumbCategory">Sales</span>
                        <span class="breadcrumb-title">
                            <span id="breadcrumbTitleText">Order Fulfillment By Item</span>
                            <span class="breadcrumb-date" id="breadcrumbDate">•</span>
                        </span>
                    </div>
                </div>
                <div class="top-bar-actions">
                    <button title="Schedule"><span>📅</span></button>
                    <button title="Refresh" onclick="runReport()"><span>🔄</span></button>
                    <button title="Share"><span>📤</span></button>
                    <button class="btn-export" title="Export">Export ▾</button>
                    <button title="Print" onclick="window.print()"><span>🖨</span></button>
                    <button class="btn-close-report" title="Close"
                        onclick="window.location.href='/reports.html'">✕</button>
                </div>
            </div>

            <!-- FILTER BAR -->
            <div class="filter-bar">
                <span class="filter-label">🔽 Filters :</span>

                <div class="filter-dropdown">
                    <span>Date Range :</span>
                    <select id="dateRangeSelect" onchange="handleDateRangeChange()">
                        <option value="this-month">This Month</option>
                        <option value="last-month">Last Month</option>
                        <option value="this-quarter">This Quarter</option>
                        <option value="this-year">This Year</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>

                <button class="filter-more">⊕ More Filters</button>

                <button class="btn-run-report" onclick="runReport()">Run Report</button>
            </div>

            <!-- OPTIONS BAR -->
            <div class="options-bar">
                <div class="option-item">
                    <span class="option-icon">📁</span>
                    Group By : <span class="option-bold">None</span> ▾
                </div>
                <div class="option-item">
                    <span class="option-icon">⚙️</span>
                    Customize Report Columns
                    <span class="customize-count">10</span>
                </div>
            </div>

            <!-- REPORT BODY -->
            <div class="report-body">
                <div class="report-header-section">
                    <div class="company-name">SOLO</div>
                    <div class="report-main-title" id="reportMainTitle">Order Fulfillment By Item</div>
                    <div class="report-date-range" id="reportDateRange">
                        From <span class="date-highlight" id="fromDateDisplay">-</span> To <span class="date-highlight"
                            id="toDateDisplay">-</span>
                    </div>
                </div>


                <div class="report-table-wrapper">
                    <table class="report-table">
                        <thead id="reportTableHead">
                            <tr>
                                <th>ITEM NAME <span class="sort-icon">⇅</span></th>
                                <th>SKU</th>
                                <th class="align-right">QUANTITY ORDERED</th>
                                <th class="align-right">CANCELLED</th>
                                <th class="align-right">DROPSHIPPED</th>
                                <th class="align-right">FORCE FULFILLED</th>
                                <th class="align-right">TO BE PACKED</th>
                                <th class="align-right">TO BE SHIPPED</th>
                                <th class="align-right">TO BE DELIVERED</th>
                                <th class="align-right">TO BE INVOICED</th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody">
                            <tr>
                                <td colspan="10" style="text-align:center; padding:40px; color:#999;">Loading...</td>
                            </tr>
                        </tbody>
                        <tfoot id="reportTableFoot" style="display:none;">
                            <tr>
                                <td>Total</td>
                                <td></td>
                                <td class="align-right" id="totalOrdered"></td>
                                <td class="align-right" id="totalCancelled"></td>
                                <td class="align-right" id="totalDropshipped"></td>
                                <td class="align-right" id="totalForceFulfilled"></td>
                                <td class="align-right" id="totalToBePacked"></td>
                                <td class="align-right" id="totalToBeShipped"></td>
                                <td class="align-right" id="totalToBeDelivered"></td>
                                <td class="align-right" id="totalToBeInvoiced"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="/js/layout.js"></script>
    <script src="/js/report-export.js"></script>
    <script>
        let currentFrom = '';
        let currentTo = '';

        document.addEventListener('DOMContentLoaded', () => {
            setThisMonth();
            runReport();
        });

        function setThisMonth() {
            const now = new Date();
            const y = now.getFullYear();
            const m = now.getMonth();
            currentFrom = new Date(y, m, 1).toISOString().split('T')[0];
            currentTo = new Date(y, m + 1, 0).toISOString().split('T')[0];
            updateDateDisplays();
        }

        function handleDateRangeChange() {
            const v = document.getElementById('dateRangeSelect').value;
            const now = new Date();
            const y = now.getFullYear();
            const m = now.getMonth();

            switch (v) {
                case 'this-month':
                    currentFrom = new Date(y, m, 1).toISOString().split('T')[0];
                    currentTo = new Date(y, m + 1, 0).toISOString().split('T')[0];
                    break;
                case 'last-month':
                    currentFrom = new Date(y, m - 1, 1).toISOString().split('T')[0];
                    currentTo = new Date(y, m, 0).toISOString().split('T')[0];
                    break;
                case 'this-quarter':
                    const qStart = Math.floor(m / 3) * 3;
                    currentFrom = new Date(y, qStart, 1).toISOString().split('T')[0];
                    currentTo = new Date(y, qStart + 3, 0).toISOString().split('T')[0];
                    break;
                case 'this-year':
                    currentFrom = new Date(y, 0, 1).toISOString().split('T')[0];
                    currentTo = new Date(y, 11, 31).toISOString().split('T')[0];
                    break;
                case 'custom':
                    break;
            }
            updateDateDisplays();
            runReport();
        }

        function updateDateDisplays() {
            const fmt = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            const fromStr = currentFrom ? fmt(currentFrom) : '-';
            const toStr = currentTo ? fmt(currentTo) : '-';

            document.getElementById('fromDateDisplay').textContent = fromStr;
            document.getElementById('toDateDisplay').textContent = toStr;
            document.getElementById('breadcrumbDate').textContent = `• From ${fromStr} To ${toStr}`;
        }

        function fmtNum(val) {
            return parseFloat(val).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // ===== MAIN REPORT =====
        async function runReport() {
            const tbody = document.getElementById('reportTableBody');
            tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:#999;">Loading...</td></tr>';
            document.getElementById('reportTableFoot').style.display = 'none';

            try {
                let url = '/api/sales/reports/order-fulfillment-by-item';
                if (currentFrom && currentTo) {
                    url += `?from=${currentFrom}&to=${currentTo}`;
                }
                const res = await fetch(url);
                if (!res.ok) throw new Error('API error');
                const data = await res.json();

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:60px;color:#999;font-size:14px;">No order fulfillment data found for the selected period.</td></tr>';
                    return;
                }

                let totalOrdered = 0, totalCancelled = 0, totalDropshipped = 0, totalForceFulfilled = 0;
                let totalToBePacked = 0, totalToBeShipped = 0, totalToBeDelivered = 0, totalToBeInvoiced = 0;

                tbody.innerHTML = data.map(item => {
                    const ordered = parseFloat(item.quantity_ordered) || 0;
                    const cancelled = parseFloat(item.cancelled) || 0;
                    const dropshipped = parseFloat(item.dropshipped) || 0;
                    const forceFulfilled = parseFloat(item.force_fulfilled) || 0;
                    const toBePacked = parseFloat(item.to_be_packed) || 0;
                    const toBeShipped = parseFloat(item.to_be_shipped) || 0;
                    const toBeDelivered = parseFloat(item.to_be_delivered) || 0;
                    const toBeInvoiced = parseFloat(item.to_be_invoiced) || 0;

                    totalOrdered += ordered;
                    totalCancelled += cancelled;
                    totalDropshipped += dropshipped;
                    totalForceFulfilled += forceFulfilled;
                    totalToBePacked += toBePacked;
                    totalToBeShipped += toBeShipped;
                    totalToBeDelivered += toBeDelivered;
                    totalToBeInvoiced += toBeInvoiced;

                    return `
                        <tr>
                            <td class="item-link">${item.item_name}</td>
                            <td>${item.sku || ''}</td>
                            <td class="align-right">${fmtNum(ordered)}</td>
                            <td class="align-right">${fmtNum(cancelled)}</td>
                            <td class="align-right">${fmtNum(dropshipped)}</td>
                            <td class="align-right">${fmtNum(forceFulfilled)}</td>
                            <td class="align-right">${fmtNum(toBePacked)}</td>
                            <td class="align-right">${fmtNum(toBeShipped)}</td>
                            <td class="align-right">${fmtNum(toBeDelivered)}</td>
                            <td class="align-right">${fmtNum(toBeInvoiced)}</td>
                        </tr>
                    `;
                }).join('');

                // Update totals
                document.getElementById('totalOrdered').textContent = fmtNum(totalOrdered);
                document.getElementById('totalCancelled').textContent = fmtNum(totalCancelled);
                document.getElementById('totalDropshipped').textContent = fmtNum(totalDropshipped);
                document.getElementById('totalForceFulfilled').textContent = fmtNum(totalForceFulfilled);
                document.getElementById('totalToBePacked').textContent = fmtNum(totalToBePacked);
                document.getElementById('totalToBeShipped').textContent = fmtNum(totalToBeShipped);
                document.getElementById('totalToBeDelivered').textContent = fmtNum(totalToBeDelivered);
                document.getElementById('totalToBeInvoiced').textContent = fmtNum(totalToBeInvoiced);
                document.getElementById('reportTableFoot').style.display = '';

            } catch (e) {
                console.error('Error:', e);
                tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:#e53935;">Error loading report data.</td></tr>';
            }
        }
    </script>
</body>

</html>
