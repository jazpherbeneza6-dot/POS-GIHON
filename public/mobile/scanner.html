<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Barcode Scanner - Inventory</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/mobile.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
</head>
<body>
  <div class="scanner-container" id="scanner-container">
    <div class="scanner-overlay"></div>
    <div class="scanner-controls">
      <button class="scanner-btn" onclick="startScanner()" id="startBtn">Start Scanner</button>
      <button class="scanner-btn" onclick="stopScanner()" id="stopBtn" style="display: none;">Stop Scanner</button>
      <button class="scanner-btn" onclick="enterBarcodeManually()">Enter Manually</button>
      <button class="scanner-btn" onclick="window.location.href='/index.html'" style="background-color: #e74c3c;">Cancel</button>
    </div>
  </div>

  <div id="scanner-result" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 24px; border-radius: 8px; z-index: 1001; max-width: 90%;">
    <h3>Item Found</h3>
    <div id="scanner-item-info"></div>
    <div style="margin-top: 16px; display: flex; gap: 8px;">
      <button class="btn btn-primary" onclick="useScannedItem()">Use Item</button>
      <button class="btn btn-secondary" onclick="closeScannerResult()">Close</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/barcode-scanner.js"></script>
  <script>
    let scannedItem = null;

    window.onBarcodeScanned = function(item, code) {
      scannedItem = item;
      document.getElementById('scanner-item-info').innerHTML = `
        <p><strong>Name:</strong> ${item.name}</p>
        <p><strong>SKU:</strong> ${item.sku || 'N/A'}</p>
        <p><strong>Stock:</strong> ${item.stock_quantity || 0}</p>
        <p><strong>Price:</strong> ${formatCurrency(item.selling_price || 0)}</p>
      `;
      document.getElementById('scanner-result').style.display = 'block';
    };

    function useScannedItem() {
      if (scannedItem) {
        // Store in sessionStorage for use in other pages
        sessionStorage.setItem('scannedItem', JSON.stringify(scannedItem));
        window.location.href = '/mobile/sales-mobile.html';
      }
    }

    function closeScannerResult() {
      document.getElementById('scanner-result').style.display = 'none';
      scannedItem = null;
      setTimeout(() => {
        if (!scannerActive) {
          startScanner();
        }
      }, 1000);
    }

    function startScanner() {
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'inline-block';
      window.startScanner();
    }

    function stopScanner() {
      document.getElementById('startBtn').style.display = 'inline-block';
      document.getElementById('stopBtn').style.display = 'none';
      window.stopScanner();
    }

    // Request camera permission on load
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(() => {
        console.log('Camera access granted');
      })
      .catch((err) => {
        console.error('Camera access denied:', err);
        showAlert('Camera access is required for barcode scanning', 'error');
      });
  </script>
</body>
</html>
