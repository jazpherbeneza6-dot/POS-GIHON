<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Stock Out - Mobile</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/mobile.css">
</head>
<body>
  <div class="header" style="position: sticky; top: 0; z-index: 100;">
    <button class="sidebar-toggle" onclick="window.location.href='/index.html'">← Back</button>
    <div style="flex: 1; text-align: center; font-weight: 600;">Stock Out</div>
    <div style="width: 60px;"></div>
  </div>

  <div class="content" style="margin-left: 0; padding: 16px;">
    <div class="card">
      <form id="stockOutForm">
        <div class="form-group">
          <label class="form-label">Scan Barcode</label>
          <button type="button" class="btn btn-primary" onclick="window.location.href='/mobile/scanner.html'" style="width: 100%; padding: 16px;">
            📷 Scan Barcode
          </button>
        </div>

        <div class="form-group">
          <label class="form-label">Or Select Item</label>
          <select class="form-select mobile-stock-input" id="stockOutItem" required>
            <option value="">Loading items...</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Quantity *</label>
          <input type="number" step="0.01" class="form-input mobile-stock-input" id="stockOutQuantity" required placeholder="Enter quantity">
        </div>

        <div class="form-group">
          <label class="form-label">Reference</label>
          <input type="text" class="form-input mobile-stock-input" id="stockOutReference" placeholder="Optional reference">
        </div>

        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea class="form-input mobile-stock-input" id="stockOutNotes" rows="3" placeholder="Optional notes"></textarea>
        </div>

        <button type="submit" class="btn btn-primary mobile-stock-button primary" style="width: 100%;">
          Remove Stock
        </button>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/api.js"></script>
  <script>
    let items = [];

    async function loadItems() {
      try {
        items = await itemsAPI.getAll();
        const select = document.getElementById('stockOutItem');
        select.innerHTML = '<option value="">Select Item</option>' + 
          items.map(item => `<option value="${item.id}">${item.name} (Stock: ${item.stock_quantity || 0})</option>`).join('');
        
        // Check for scanned item
        const scannedItem = sessionStorage.getItem('scannedItem');
        if (scannedItem) {
          const item = JSON.parse(scannedItem);
          select.value = item.id;
          sessionStorage.removeItem('scannedItem');
        }
      } catch (error) {
        console.error('Error loading items:', error);
      }
    }

    document.getElementById('stockOutForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const data = {
        item_id: parseInt(document.getElementById('stockOutItem').value),
        quantity: parseFloat(document.getElementById('stockOutQuantity').value),
        reference: document.getElementById('stockOutReference').value,
        notes: document.getElementById('stockOutNotes').value
      };
      
      try {
        await inventoryAPI.stockOut(data);
        showAlert('Stock removed successfully', 'success');
        document.getElementById('stockOutForm').reset();
        setTimeout(() => {
          window.location.href = '/inventory.html';
        }, 1500);
      } catch (error) {
        showAlert(error.message || 'Failed to remove stock', 'error');
      }
    });

    loadItems();
  </script>
</body>
</html>
