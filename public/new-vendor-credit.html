<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Vendor Credit - Inventory Management</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', 'Source Sans Pro', Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .main-layout {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .content {
            flex: 1;
            margin-left: 260px;
            background: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }

        /* Page Header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            border-bottom: 1px solid #e9ecef;
            background: white;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .page-title-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-icon {
            font-size: 20px;
        }

        .page-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #333;
        }

        /* Two Column Layout */
        .form-main {
            display: flex;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 70px;
        }

        .left-column {
            width: 36%;
            min-width: 320px;
            max-width: 400px;
            border-right: 2px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .right-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* Form Rows */
        .form-row {
            display: flex;
            align-items: flex-start;
            padding: 15px 24px;
            border-bottom: 1px solid #f0f0f0;
            gap: 12px;
        }

        .form-label {
            width: 120px;
            min-width: 120px;
            font-size: 12px;
            color: #666;
            padding-top: 6px;
            font-weight: 500;
        }

        .form-label.required::after {
            content: ' *';
            color: #dc2626;
        }

        .form-value {
            flex: 1;
            min-width: 0;
        }

        .form-value input,
        .form-value select,
        .form-value textarea {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            box-sizing: border-box;
        }

        .form-value input:focus,
        .form-value select:focus,
        .form-value textarea:focus {
            border-color: #4285f4;
        }

        .form-value input[readonly] {
            background: #f5f5f5;
            color: #666;
        }

        .form-value textarea {
            resize: vertical;
            min-height: 80px;
        }

        .vendor-display {
            font-size: 14px;
            font-weight: 500;
            color: #4285f4;
            padding: 6px 0;
        }

        /* Item Table */
        .item-table-section {
            padding: 0;
        }

        .item-table-header {
            padding: 14px 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .item-table-title {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }

        .item-table {
            width: 100%;
            border-collapse: collapse;
        }

        .item-table thead th {
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            padding: 10px 12px;
            border-bottom: 2px solid #e0e0e0;
            background: #f9fafb;
        }

        .item-table thead th.center {
            text-align: center;
        }

        .item-table tbody td {
            padding: 10px 12px;
            font-size: 13px;
            color: #333;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }

        .item-table tbody td.center {
            text-align: center;
        }

        .item-table tbody td input[type="number"] {
            width: 70px;
            padding: 5px 6px;
            border: 1px solid #d0d0d0;
            border-radius: 3px;
            font-size: 13px;
            outline: none;
        }

        .item-table tbody td input[type="number"]:focus {
            border-color: #4285f4;
        }

        .item-image {
            width: 28px;
            height: 28px;
            background: #f0f0f0;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .item-name {
            font-weight: 500;
            color: #333;
        }

        .item-account {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }

        .row-amount {
            font-weight: 500;
        }

        .delete-row-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 18px;
            cursor: pointer;
        }

        .delete-row-btn:hover {
            color: #dc2626;
        }

        /* Totals */
        .totals-section {
            display: flex;
            justify-content: flex-end;
            padding: 20px;
        }

        .totals-box {
            width: 320px;
        }

        .totals-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 13px;
        }

        .totals-label {
            color: #666;
        }

        .totals-value {
            font-weight: 500;
            color: #333;
        }

        .totals-row.total {
            border-top: 2px solid #333;
            padding-top: 12px;
            margin-top: 8px;
        }

        .totals-row.total .totals-label,
        .totals-row.total .totals-value {
            font-weight: 700;
            font-size: 14px;
            color: #333;
        }

        .totals-input {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .totals-input input {
            width: 60px;
            padding: 4px 6px;
            border: 1px solid #d0d0d0;
            border-radius: 3px;
            font-size: 13px;
            text-align: right;
            outline: none;
        }

        .totals-input input:focus {
            border-color: #4285f4;
        }

        /* Footer */
        .form-footer {
            position: fixed;
            bottom: 0;
            left: 260px;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: white;
            border-top: 1px solid #e0e0e0;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.05);
            z-index: 100;
        }

        .footer-left {
            display: flex;
            gap: 10px;
        }

        .btn-draft {
            padding: 8px 20px;
            background: white;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            color: #555;
        }

        .btn-draft:hover {
            background: #f5f5f5;
        }

        .btn-save {
            padding: 8px 24px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-save:hover {
            background: #3367d6;
        }

        .btn-cancel {
            padding: 8px 20px;
            background: none;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            color: #666;
        }

        .btn-cancel:hover {
            background: #f5f5f5;
        }

        .footer-right .amount {
            font-size: 16px;
            font-weight: 700;
            color: #333;
        }

        /* Source Bill Info */
        .source-info {
            padding: 10px 24px;
            background: #eef6ff;
            border-bottom: 1px solid #d0e4f7;
            font-size: 12px;
            color: #1a73e8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .source-info a {
            color: #1a73e8;
            font-weight: 600;
            text-decoration: none;
        }

        .source-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div id="sidebarContainer"></div>

    <div class="main-layout">
        <div class="content">
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-title-wrapper">
                    <span class="page-icon">📝</span>
                    <h1 class="page-title">New Vendor Credit</h1>
                </div>
                <button class="close-btn" onclick="goBack()">×</button>
            </div>

            <!-- Source Bill Info Bar -->
            <div class="source-info" id="sourceInfo" style="display:none;">
                📦 Creating Vendor Credit from Bill <a href="#" id="sourceBillLink"></a>
            </div>

            <!-- Form Main -->
            <div class="form-main">
                <!-- Left Column -->
                <div class="left-column">
                    <div class="form-row">
                        <div class="form-label">Vendor Name</div>
                        <div class="form-value">
                            <div class="vendor-display" id="vendorName">—</div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-label required">Vendor Credit#</div>
                        <div class="form-value">
                            <input type="text" id="creditNumber" placeholder="VC-00001">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-label">Credit Date</div>
                        <div class="form-value">
                            <input type="date" id="creditDate">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-label">Reference</div>
                        <div class="form-value">
                            <input type="text" id="reference" readonly placeholder="Bill#">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-label">Reason for Credit</div>
                        <div class="form-value">
                            <textarea id="reason" placeholder="Enter the reason for this vendor credit..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Right Column -->
                <div class="right-column">
                    <!-- Item Table -->
                    <div class="item-table-section">
                        <div class="item-table-header">
                            <span class="item-table-title">Item Table</span>
                        </div>
                        <table class="item-table">
                            <thead>
                                <tr>
                                    <th style="width:32px;"></th>
                                    <th>ITEM DETAILS</th>
                                    <th>ACCOUNT</th>
                                    <th class="center" style="width:80px;">QTY</th>
                                    <th class="center" style="width:90px;">RATE ₱</th>
                                    <th class="center" style="width:100px;">AMOUNT</th>
                                    <th style="width:30px;"></th>
                                </tr>
                            </thead>
                            <tbody id="itemTableBody">
                            </tbody>
                        </table>
                    </div>

                    <!-- Totals -->
                    <div class="totals-section">
                        <div class="totals-box">
                            <div class="totals-row">
                                <span class="totals-label">Sub Total</span>
                                <span class="totals-value" id="subTotal">0.00</span>
                            </div>
                            <div class="totals-row">
                                <span class="totals-label">Discount</span>
                                <div class="totals-input">
                                    <input type="number" id="discountValue" value="0" oninput="recalculateTotals()">
                                    <span>%</span>
                                    <span class="totals-value" id="discountAmount">0.00</span>
                                </div>
                            </div>
                            <div class="totals-row">
                                <span class="totals-label">Adjustment</span>
                                <div class="totals-input">
                                    <input type="number" id="adjustmentValue" value="0" oninput="recalculateTotals()">
                                    <span class="totals-value" id="adjustmentAmount">0.00</span>
                                </div>
                            </div>
                            <div class="totals-row total">
                                <span class="totals-label">Total ( PHP )</span>
                                <span class="totals-value" id="total">0.00</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="form-footer">
                <div class="footer-left">
                    <button class="btn-draft" onclick="saveCredit('draft')">Save as Draft</button>
                    <button class="btn-save" onclick="saveCredit('open')">Save as Open</button>
                    <button class="btn-cancel" onclick="goBack()">Cancel</button>
                </div>
                <div class="footer-right">
                    <div><span>Total:</span> <span class="amount" id="footerTotal">PHP 0.00</span></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/layout.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sourceBillId = urlParams.get('billId');
        let billData = null;

        document.addEventListener('DOMContentLoaded', async function () {
            // Set today's date
            const _d = new Date(); document.getElementById('creditDate').value = _d.getFullYear() + '-' + String(_d.getMonth() + 1).padStart(2, '0') + '-' + String(_d.getDate()).padStart(2, '0');

            // Get next credit number
            try {
                const numRes = await fetch('/api/vendor-credits/next-number');
                if (numRes.ok) {
                    const numData = await numRes.json();
                    document.getElementById('creditNumber').value = numData.credit_number;
                }
            } catch (e) { }

            // If creating from a bill, load bill data
            if (sourceBillId) {
                await loadBillData(sourceBillId);
            }
        });

        async function loadBillData(billId) {
            try {
                const res = await fetch('/api/bills/' + billId);
                if (!res.ok) return;
                billData = await res.json();

                // Show source info
                const sourceInfo = document.getElementById('sourceInfo');
                sourceInfo.style.display = 'flex';
                const link = document.getElementById('sourceBillLink');
                link.textContent = billData.bill_number || 'BILL-' + billData.id;
                link.href = '/bill-detail.html?id=' + billData.id;

                // Fill left panel
                document.getElementById('vendorName').textContent = billData.supplier_name || '—';
                document.getElementById('reference').value = billData.bill_number || '';

                // Fill item table from bill items
                const tbody = document.getElementById('itemTableBody');
                tbody.innerHTML = '';

                const items = billData.items || [];
                items.forEach(item => {
                    const qty = parseFloat(item.quantity) || 1;
                    const rate = parseFloat(item.rate) || 0;
                    const amount = (qty * rate).toFixed(2);
                    const acct = item.account || 'inventory';
                    const acctType = item.account_type || 'inventory';
                    const isExpense = acctType !== 'inventory';

                    const acctLabel = getAccountLabel(acct);

                    const tr = document.createElement('tr');
                    tr.setAttribute('data-item-id', item.item_id || '');
                    tr.setAttribute('data-account', acct);
                    tr.setAttribute('data-account-type', acctType);
                    tr.innerHTML = `
                        <td><div class="item-image">${isExpense ? '💡' : '🖼️'}</div></td>
                        <td>
                            <div class="item-name">${item.item_name || '—'}</div>
                            <div class="item-account">${acctLabel}</div>
                        </td>
                        <td style="font-size:12px;color:#666;">${acctLabel}</td>
                        <td class="center">
                            <input type="number" value="${qty}" min="0" step="1" class="qty-input" onchange="updateRowAmount(this)">
                        </td>
                        <td class="center" style="font-weight:500;">₱${rate.toFixed(2)}</td>
                        <td class="center row-amount" style="font-weight:500;">${amount}</td>
                        <td class="center"><button class="delete-row-btn" onclick="deleteRow(this)">×</button></td>
                    `;
                    tr.setAttribute('data-rate', rate);
                    tbody.appendChild(tr);
                });

                recalculateTotals();
            } catch (e) {
                console.error('Error loading bill data:', e);
            }
        }

        function getAccountLabel(acct) {
            const map = {
                'inventory': 'Inventory Asset',
                'electricity-expense': 'Electricity Expense',
                'utilities-expense': 'Utilities',
                'rent-expense': 'Rent Expense',
                'office-supplies': 'Office Supplies',
                'repairs-maintenance': 'Repairs & Maintenance',
                'telecommunications': 'Telecommunications',
                'transportation': 'Transportation',
                'professional-fees': 'Professional Fees',
                'miscellaneous-expense': 'Miscellaneous Expense'
            };
            return map[acct] || acct || 'Inventory Asset';
        }

        function updateRowAmount(input) {
            const row = input.closest('tr');
            const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
            const rate = parseFloat(row.getAttribute('data-rate')) || 0;
            const amountCell = row.querySelector('.row-amount');
            if (amountCell) amountCell.textContent = (qty * rate).toFixed(2);
            recalculateTotals();
        }

        function deleteRow(btn) {
            const tbody = document.getElementById('itemTableBody');
            if (tbody.rows.length > 1) {
                btn.closest('tr').remove();
                recalculateTotals();
            }
        }

        function recalculateTotals() {
            const rows = document.getElementById('itemTableBody').rows;
            let sub = 0;
            for (let i = 0; i < rows.length; i++) {
                const a = rows[i].querySelector('.row-amount');
                if (a) sub += parseFloat(a.textContent) || 0;
            }
            document.getElementById('subTotal').textContent = sub.toFixed(2);

            const dp = parseFloat(document.getElementById('discountValue').value) || 0;
            const da = sub * (dp / 100);
            document.getElementById('discountAmount').textContent = da.toFixed(2);

            const adj = parseFloat(document.getElementById('adjustmentValue').value) || 0;
            const total = sub - da + adj;
            document.getElementById('total').textContent = total.toFixed(2);
            document.getElementById('footerTotal').textContent = 'PHP ' + total.toFixed(2);
        }

        // Save vendor credit
        async function saveCredit(status) {
            const creditNumber = document.getElementById('creditNumber').value.trim();
            if (!creditNumber) { alert('Please enter a vendor credit number'); return; }

            const rows = document.getElementById('itemTableBody').rows;
            const items = [];
            for (let i = 0; i < rows.length; i++) {
                const r = rows[i];
                const nameEl = r.querySelector('.item-name');
                if (!nameEl) continue;
                const name = nameEl.textContent.trim();
                if (!name || name === '—') continue;

                const qty = parseFloat(r.querySelector('.qty-input')?.value) || 0;
                if (qty <= 0) continue;

                items.push({
                    item_id: r.getAttribute('data-item-id') ? parseInt(r.getAttribute('data-item-id')) : null,
                    item_name: name,
                    account: r.getAttribute('data-account') || 'inventory',
                    account_type: r.getAttribute('data-account-type') || 'inventory',
                    quantity: qty,
                    rate: parseFloat(r.getAttribute('data-rate')) || 0
                });
            }

            if (items.length === 0) { alert('Please include at least one item with quantity > 0'); return; }

            const payload = {
                credit_number: creditNumber,
                bill_id: sourceBillId ? parseInt(sourceBillId) : null,
                bill_number: billData?.bill_number || null,
                supplier_id: billData?.supplier_id || null,
                supplier_name: billData?.supplier_name || null,
                credit_date: document.getElementById('creditDate').value || null,
                reference: document.getElementById('reference').value.trim() || null,
                reason: document.getElementById('reason').value.trim() || null,
                discount_percent: parseFloat(document.getElementById('discountValue').value) || 0,
                adjustment: parseFloat(document.getElementById('adjustmentValue').value) || 0,
                items: items,
                status: status
            };

            try {
                const res = await fetch('/api/vendor-credits', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                if (!res.ok) { alert('Error: ' + (result.error || 'Failed to save')); return; }

                showToast('Vendor Credit has been created');
                setTimeout(() => {
                    window.location.href = '/vendor-credits.html';
                }, 1200);
            } catch (e) {
                console.error(e);
                alert('Failed to save vendor credit');
            }
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.textContent = msg;
            t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#16a34a;color:white;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:500;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.15);';
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function goBack() {
            if (sourceBillId) {
                window.location.href = '/bill-detail.html?id=' + sourceBillId;
            } else {
                window.location.href = '/bills.html';
            }
        }
    </script>
</body>

</html>
