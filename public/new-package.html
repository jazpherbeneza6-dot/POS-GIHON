<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Package - Inventory Management</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', 'Source Sans Pro', Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            padding: 0;
            background: #fff;
            font-size: 13px;
        }

        .main-layout {
            display: flex;
            min-height: 100vh;
        }

        .content {
            flex: 1;
            margin-left: 260px;
            padding: 0;
            background: #fff;
        }

        /* Page Header */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 32px;
            background: white;
            border-bottom: 1px solid #e9ecef;
        }

        .page-title-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-icon {
            font-size: 22px;
        }

        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
            line-height: 1;
        }

        .close-btn:hover {
            color: #333;
        }

        /* Form Container */
        .form-container {
            padding: 32px 40px;
            max-width: 960px;
        }

        /* Form Rows */
        .form-row {
            display: grid;
            grid-template-columns: 130px 1fr;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-label {
            font-size: 13px;
            color: #333;
            font-weight: 500;
        }

        .form-label.required {
            color: #dc2626;
        }

        .form-input-wrapper {
            max-width: 320px;
        }

        .form-select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
            background: white;
            cursor: pointer;
        }

        .form-select:focus {
            outline: none;
            border-color: #4285f4;
        }

        /* Middle Form Section (Package Slip / Date) */
        .form-section-middle {
            background: #f9fafb;
            padding: 20px 24px;
            margin: 24px 0;
            border-radius: 4px;
            border: 1px solid #eee;
        }

        .form-row-inline {
            display: flex;
            gap: 48px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label-small {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .form-label-small.required {
            color: #f87171;
        }

        .form-input {
            padding: 9px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 4px;
            font-size: 13px;
            min-width: 160px;
            background: white;
        }

        .form-input:focus {
            outline: none;
            border-color: #4285f4;
        }

        .input-with-icon {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-icon {
            color: #999;
            font-size: 16px;
        }

        /* Divider */
        .section-divider {
            border: none;
            border-top: 1px solid #e9ecef;
            margin: 28px 0 20px 0;
        }

        /* Item Table */
        .items-table-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
        }

        .items-table th {
            text-align: left;
            padding: 12px 16px;
            font-size: 10px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e0e0e0;
            background: #fafafa;
        }

        .items-table .col-description {
            width: 40%;
        }

        .items-table .col-ordered,
        .items-table .col-packed,
        .items-table .col-quantity {
            width: 20%;
            text-align: center;
        }

        .items-table th.col-ordered,
        .items-table th.col-packed,
        .items-table th.col-quantity {
            text-align: center;
        }

        .items-table td {
            padding: 14px 16px;
            font-size: 13px;
            color: #333;
            border-bottom: 1px solid #f0f0f0;
        }

        /* Internal Notes */
        .internal-notes-section {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid #e9ecef;
        }

        .form-textarea {
            width: 100%;
            max-width: 350px;
            padding: 10px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 4px;
            font-size: 13px;
            resize: vertical;
            font-family: inherit;
            min-height: 80px;
        }

        .form-textarea:focus {
            outline: none;
            border-color: #4285f4;
        }

        /* Footer Buttons */
        .form-footer {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .btn-save {
            padding: 10px 24px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-save:hover {
            background: #3367d6;
        }

        .btn-cancel {
            padding: 10px 24px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-cancel:hover {
            background: #444;
        }

        /* Address Section */
        .address-section {
            margin-bottom: 0;
        }

        .address-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            max-width: 500px;
        }

        .address-label {
            font-size: 11px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .address-text {
            font-size: 13px;
            color: #333;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <!-- Sidebar Container -->
    <div id="sidebarContainer"></div>

    <div class="main-layout">
        <div class="content" id="content">
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-title-wrapper">
                    <span class="page-icon">📦</span>
                    <h1 class="page-title">New Package</h1>
                </div>
                <button class="close-btn" onclick="goBack()">×</button>
            </div>

            <!-- Form Container -->
            <div class="form-container">
                <!-- Customer Name -->
                <div class="form-row">
                    <label class="form-label">Customer Name</label>
                    <div class="form-input-wrapper">
                        <select class="form-select" id="customerName">
                            <option value="">Select Customer</option>
                        </select>
                    </div>
                </div>

                <!-- Sales Order# -->
                <div class="form-row">
                    <label class="form-label required">Sales Order#*</label>
                    <div class="form-input-wrapper">
                        <select class="form-select" id="salesOrder">
                            <option value="">Select Sales Order</option>
                        </select>
                    </div>
                </div>

                <!-- Package Slip / Date -->
                <div class="form-section-middle">
                    <div class="form-row-inline">
                        <div class="form-group">
                            <label class="form-label-small required">Package Slip#*</label>
                            <input type="text" class="form-input" id="packageSlip">
                        </div>
                        <div class="form-group">
                            <label class="form-label-small required">Date*</label>
                            <input type="text" class="form-input" id="packageDate" placeholder="dd MMM yyyy">
                        </div>
                    </div>
                </div>

                <!-- Billing / Shipping Address -->
                <div id="addressSection" class="address-section" style="display:none; margin-bottom:20px;">
                    <div class="address-grid">
                        <div>
                            <div class="address-label">Billing Address</div>
                            <div class="address-text" id="pkgBillingAddress">—</div>
                        </div>
                        <div>
                            <div class="address-label">Shipping Address</div>
                            <div class="address-text" id="pkgShippingAddress">—</div>
                        </div>
                    </div>
                </div>

                <!-- Items Table -->
                <hr class="section-divider">
                <div class="items-table-title">Item Table</div>
                <table class="items-table">
                    <thead>
                        <tr>
                            <th class="col-description">ITEM DETAILS</th>
                            <th class="col-ordered">ORDERED</th>
                            <th class="col-packed">PACKED</th>
                            <th class="col-quantity">QUANTITY TO PACK</th>
                        </tr>
                    </thead>
                    <tbody id="packageItemsBody">
                        <!-- Items will be added here -->
                    </tbody>
                </table>

                <!-- Internal Notes -->
                <div class="internal-notes-section">
                    <label class="form-label-small">INTERNAL NOTES</label>
                    <textarea class="form-textarea" id="internalNotes" rows="4" placeholder=""></textarea>
                </div>

                <!-- Footer Buttons -->
                <div class="form-footer">
                    <button class="btn-save" onclick="savePackage()">Save</button>
                    <button class="btn-cancel" onclick="goBack()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/layout.js"></script>
    <script>
        let allCustomers = [];
        let allSalesOrders = [];
        let allPackages = [];
        let selectedCustomerId = '';
        let selectedOrderId = '';
        let orderItems = [];

        // ===== Init =====
        (async function init() {
            // Set today's date
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            document.getElementById('packageDate').value = `${dd} ${months[today.getMonth()]} ${today.getFullYear()}`;

            // Load next package number
            try {
                const res = await fetch('/api/packages/next-number');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('packageSlip').value = data.package_number;
                }
            } catch (e) { console.error(e); }

            // Load all sales orders FIRST (before customer auto-select)
            try {
                const res = await fetch('/api/sales-orders');
                if (res.ok) {
                    allSalesOrders = await res.json();
                }
            } catch (e) { console.error(e); }

            // Load all packages to know which SOs already have packages
            try {
                const res = await fetch('/api/packages');
                if (res.ok) {
                    allPackages = await res.json();
                }
            } catch (e) { console.error(e); }

            // Load customers
            try {
                const res = await fetch('/api/customers');
                if (res.ok) {
                    allCustomers = await res.json();
                    const sel = document.getElementById('customerName');
                    sel.innerHTML = '<option value="">Select Customer</option>' +
                        allCustomers.map(c => {
                            const name = c.display_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || 'Unnamed';
                            return `<option value="${c.id}">${name}</option>`;
                        }).join('');

                    // Auto-select from URL
                    const urlParams = new URLSearchParams(window.location.search);
                    const preselect = urlParams.get('customerId');
                    if (preselect) {
                        sel.value = preselect;
                        onCustomerChange();

                        // Also auto-select SO if soId is in URL
                        const soIdParam = urlParams.get('soId');
                        if (soIdParam) {
                            const soSel = document.getElementById('salesOrder');
                            soSel.value = soIdParam;
                            if (soSel.value === soIdParam) {
                                onOrderChange();
                            }
                        }
                    }
                }
            } catch (e) { console.error(e); }
        })();

        // ===== Customer Change =====
        document.getElementById('customerName').addEventListener('change', onCustomerChange);

        function onCustomerChange() {
            selectedCustomerId = document.getElementById('customerName').value;
            selectedOrderId = '';
            orderItems = [];
            document.getElementById('packageItemsBody').innerHTML = '';

            // Show address
            const c = allCustomers.find(x => String(x.id) === selectedCustomerId);
            const section = document.getElementById('addressSection');
            if (c) {
                const billingParts = [c.billing_street, c.billing_city, c.billing_state, c.billing_zip, c.billing_country].filter(Boolean);
                const shippingParts = [c.shipping_street, c.shipping_city, c.shipping_state, c.shipping_zip, c.shipping_country].filter(Boolean);
                document.getElementById('pkgBillingAddress').textContent = billingParts.length > 0 ? billingParts.join(', ') : '—';
                document.getElementById('pkgShippingAddress').textContent = shippingParts.length > 0 ? shippingParts.join(', ') : '—';
                section.style.display = 'block';
            } else {
                section.style.display = 'none';
            }

            // Filter sales orders: this customer, not closed/delivered, and NO existing package
            const soIdsWithPackage = new Set(allPackages.map(p => String(p.sales_order_id)));
            const filtered = allSalesOrders.filter(so =>
                String(so.customer_id) === selectedCustomerId &&
                so.status !== 'DELIVERED' && so.status !== 'CLOSED' &&
                !soIdsWithPackage.has(String(so.id))
            );

            const soSel = document.getElementById('salesOrder');
            soSel.innerHTML = '<option value="">Select Sales Order</option>' +
                filtered.map(so => `<option value="${so.id}">${so.order_number} - ${so.customer_name || ''}</option>`).join('');

            // Auto-select if only one SO, then load items
            if (filtered.length === 1) {
                soSel.value = String(filtered[0].id);
                onOrderChange();
            }
        }

        // ===== Sales Order Change =====
        document.getElementById('salesOrder').addEventListener('change', onOrderChange);

        async function onOrderChange() {
            selectedOrderId = document.getElementById('salesOrder').value;
            if (!selectedOrderId) {
                document.getElementById('packageItemsBody').innerHTML = '';
                return;
            }

            // Fetch order details with items
            try {
                const res = await fetch('/api/sales-orders/' + selectedOrderId);
                if (!res.ok) return;
                const order = await res.json();
                const items = order.items || [];

                // Get already packed quantities for this order
                let packedMap = {};
                try {
                    const pkgRes = await fetch('/api/packages/by-order/' + selectedOrderId);
                    if (pkgRes.ok) {
                        const packages = await pkgRes.json();
                        for (const pkg of packages) {
                            if (pkg.items) {
                                for (const pi of pkg.items) {
                                    const key = (pi.item_name || '').toLowerCase();
                                    packedMap[key] = (packedMap[key] || 0) + (parseFloat(pi.packed_quantity) || parseFloat(pi.quantity_to_pack) || 0);
                                }
                            }
                        }
                    }
                } catch (e) { console.error(e); }

                // Render items
                const tbody = document.getElementById('packageItemsBody');
                orderItems = items.map(item => {
                    const ordered = parseFloat(item.quantity) || 0;
                    const packed = packedMap[(item.item_name || '').toLowerCase()] || 0;
                    const toPack = Math.max(ordered - packed, 0);
                    return {
                        item_name: item.item_name,
                        item_id: item.item_id || null,
                        ordered_quantity: ordered,
                        packed_quantity: packed,
                        quantity_to_pack: toPack
                    };
                });

                tbody.innerHTML = orderItems.map((item, i) => `
                    <tr>
                        <td>${item.item_name}</td>
                        <td style="text-align:center;">${item.ordered_quantity.toFixed(2)}</td>
                        <td style="text-align:center;">${item.packed_quantity.toFixed(2)}</td>
                        <td style="text-align:center;">
                            <input type="number" value="${item.quantity_to_pack.toFixed(2)}" min="0" max="${item.ordered_quantity - item.packed_quantity}"
                                style="width:80px;text-align:center;padding:8px;border:1px solid #d0d5dd;border-radius:4px;font-size:13px;"
                                onchange="orderItems[${i}].quantity_to_pack = parseFloat(this.value) || 0">
                        </td>
                    </tr>
                `).join('');

            } catch (e) {
                console.error('Error loading sales order:', e);
            }
        }

        // ===== Save =====
        async function savePackage() {
            if (!selectedOrderId) {
                alert('Please select a Sales Order');
                return;
            }

            const packageSlip = document.getElementById('packageSlip').value;
            if (!packageSlip) {
                alert('Please enter Package Slip#');
                return;
            }

            const selectedOrder = allSalesOrders.find(so => String(so.id) === selectedOrderId);
            const customerSel = document.getElementById('customerName');
            const customerName = customerSel.options[customerSel.selectedIndex]?.text || '';

            const data = {
                package_number: packageSlip,
                sales_order_id: parseInt(selectedOrderId),
                sales_order_number: selectedOrder ? selectedOrder.order_number : '',
                customer_name: customerName,
                package_date: (function () { const _d = new Date(); return _d.getFullYear() + '-' + String(_d.getMonth() + 1).padStart(2, '0') + '-' + String(_d.getDate()).padStart(2, '0') })(),
                internal_notes: document.getElementById('internalNotes').value,
                status: 'NOT SHIPPED',
                items: orderItems.filter(i => i.quantity_to_pack > 0).map(i => ({
                    item_name: i.item_name,
                    item_id: i.item_id,
                    ordered_quantity: i.ordered_quantity,
                    packed_quantity: i.quantity_to_pack,
                    quantity_to_pack: i.quantity_to_pack
                }))
            };

            try {
                const res = await fetch('/api/packages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert('Package created successfully!');
                    goBack();
                } else {
                    const err = await res.json();
                    alert('Error: ' + (err.error || 'Failed to create package'));
                }
            } catch (e) {
                console.error('Error saving package:', e);
                alert('Failed to save package.');
            }
        }

        function goBack() {
            window.location.href = '/packages.html';
        }
    </script>
</body>

</html>
