<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Package - Inventory Management</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', 'Source Sans Pro', Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f6fa;
            font-size: 13px;
        }

        /* Main Content */
        .main-layout {
            display: flex;
            min-height: 100vh;
        }

        .content {
            flex: 1;
            margin-left: 260px;
            padding: 0;
            background: #f5f6fa;
        }

        /* Page Header */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: white;
            border-bottom: 1px solid #e9ecef;
        }

        .page-title-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-icon {
            font-size: 24px;
        }

        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: #999;
            cursor: pointer;
            line-height: 1;
        }

        .close-btn:hover {
            color: #333;
        }

        /* Form Container */
        .form-container {
            padding: 24px;
            max-width: 100%;
        }

        /* Form Styles */
        .form-section-top {
            background: white;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .form-label {
            font-size: 13px;
            color: #333;
            font-weight: 500;
        }

        .form-label.required {
            color: #dc2626;
        }

        .form-input-wrapper {
            max-width: 450px;
        }

        .form-select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            color: #666;
            background: white;
            cursor: pointer;
        }

        .form-select:focus {
            outline: none;
            border-color: #4285f4;
        }

        /* Middle Form Section */
        .form-section-middle {
            background: #f9fafb;
            padding: 24px;
            margin-bottom: 24px;
            border-radius: 8px;
        }

        .form-row-inline {
            display: flex;
            gap: 60px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label-small {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-label-small.required {
            color: #f87171;
        }

        .input-with-icon {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-input {
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            min-width: 250px;
            background: white;
        }

        .form-input:focus {
            outline: none;
            border-color: #4285f4;
        }

        .input-icon {
            color: #999;
            font-size: 18px;
        }

        /* Info Message */
        .info-message {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
            padding: 16px 24px;
            background: white;
            border-radius: 8px;
        }

        .info-icon {
            color: #60a5fa;
            font-size: 16px;
        }

        .info-link {
            color: #f87171;
            text-decoration: none;
            margin-left: 4px;
        }

        .info-link:hover {
            text-decoration: underline;
        }

        /* Items Table */
        .items-table-section {
            background: white;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
        }

        .items-table th {
            text-align: left;
            padding: 14px 16px;
            font-size: 11px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e9ecef;
        }

        .items-table .col-description {
            width: 40%;
        }

        .items-table .col-ordered,
        .items-table .col-packed,
        .items-table .col-quantity {
            width: 20%;
            text-align: center;
        }

        .items-table th.col-ordered,
        .items-table th.col-packed,
        .items-table th.col-quantity {
            text-align: center;
        }

        .items-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        /* Internal Notes */
        .internal-notes-section {
            background: white;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .form-textarea {
            width: 100%;
            max-width: 500px;
            padding: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            resize: vertical;
            font-family: inherit;
            min-height: 100px;
        }

        .form-textarea:focus {
            outline: none;
            border-color: #4285f4;
        }

        /* Footer Buttons */
        .form-footer {
            display: flex;
            gap: 12px;
            padding: 24px;
            background: white;
            border-radius: 8px;
        }

        .btn-save {
            padding: 12px 24px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-save:hover {
            background: #3367d6;
        }

        .btn-cancel {
            padding: 12px 24px;
            background: #333;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-cancel:hover {
            background: #444;
        }
    </style>
</head>

<body>
    <!-- Sidebar Container -->
    <div id="sidebarContainer"></div>

    <div class="main-layout">
        <div class="content" id="content">
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-title-wrapper">
                    <span class="page-icon">📦</span>
                    <h1 class="page-title">New Package</h1>
                </div>
                <button class="close-btn" onclick="goBack()">×</button>
            </div>

            <!-- Form Container -->
            <div class="form-container">
                <!-- Top Form Section -->
                <div class="form-section-top">
                    <div class="form-row">
                        <label class="form-label">Customer Name</label>
                        <div class="form-input-wrapper">
                            <select class="form-select" id="customerName">
                                <option value="">Select Customer</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="form-label required">Sales Order#*</label>
                        <div class="form-input-wrapper">
                            <select class="form-select" id="salesOrder">
                                <option value="">Select Sales Order</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Middle Form Section -->
                <div class="form-section-middle">
                    <div class="form-row-inline">
                        <div class="form-group">
                            <label class="form-label-small required">PACKAGE SLIP#*</label>
                            <div class="input-with-icon">
                                <input type="text" class="form-input" id="packageSlip" placeholder="">
                                <span class="input-icon">⏱</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label-small required">DATE*</label>
                            <input type="text" class="form-input" id="packageDate" placeholder="dd MMM yyyy">
                        </div>
                    </div>
                </div>

                <!-- Info Message -->
                <div class="info-message">
                    <span class="info-icon">ℹ</span>
                    You can also select or scan the items to be included from the sales order.
                    <a href="#" class="info-link">Select or Scan Items</a>
                </div>

                <!-- Items Table -->
                <div class="items-table-section">
                    <table class="items-table">
                        <thead>
                            <tr>
                                <th class="col-description">ITEMS & DESCRIPTION</th>
                                <th class="col-ordered">ORDERED</th>
                                <th class="col-packed">PACKED</th>
                                <th class="col-quantity">QUANTITY TO PACK</th>
                            </tr>
                        </thead>
                        <tbody id="packageItemsBody">
                            <!-- Items will be added here -->
                        </tbody>
                    </table>
                </div>

                <!-- Internal Notes -->
                <div class="internal-notes-section">
                    <label class="form-label-small">INTERNAL NOTES</label>
                    <textarea class="form-textarea" id="internalNotes" rows="4" placeholder=""></textarea>
                </div>

                <!-- Footer Buttons -->
                <div class="form-footer">
                    <button class="btn-save" onclick="savePackage()">Save</button>
                    <button class="btn-cancel" onclick="goBack()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Layout Script -->
    <script src="/js/layout.js"></script>
    <script>
        // Go back to packages list
        function goBack() {
            window.location.href = '/packages.html';
        }

        // Save Package
        function savePackage() {
            const customerName = document.getElementById('customerName').value;
            const salesOrder = document.getElementById('salesOrder').value;
            const packageSlip = document.getElementById('packageSlip').value;
            const packageDate = document.getElementById('packageDate').value;
            const internalNotes = document.getElementById('internalNotes').value;

            if (!salesOrder) {
                alert('Please select a Sales Order');
                return;
            }

            if (!packageSlip) {
                alert('Please enter Package Slip#');
                return;
            }

            // Here you would save to the database
                customerName,
                salesOrder,
                packageSlip,
                packageDate,
                internalNotes
            });

            alert('Package saved successfully!');
            goBack();
        }
    </script>
</body>

</html>
