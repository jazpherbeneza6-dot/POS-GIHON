<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendors - Inventory Management</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', 'Source Sans Pro', Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f6fa;
            font-size: 13px;
        }

        .main-layout {
            display: flex;
            min-height: 100vh;
        }

        .content {
            flex: 1;
            margin-left: 260px;
            padding: 0;
            background: white;
        }

        /* Page Header */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: white;
            border-bottom: 1px solid #e9ecef;
        }

        .page-title-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .page-title:hover {
            color: #4285f4;
        }

        .dropdown-arrow {
            font-size: 10px;
            color: #666;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-new-group {
            display: flex;
        }

        .btn-new {
            padding: 8px 16px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px 0 0 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-new:hover {
            background: #3367d6;
        }

        .btn-new-dropdown {
            padding: 8px 10px;
            background: #3367d6;
            color: white;
            border: none;
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 10px;
        }

        .btn-new-dropdown:hover {
            background: #2d5bb9;
        }

        .btn-more {
            width: 36px;
            height: 36px;
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-more:hover {
            background: #f5f5f5;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 120px 24px;
            text-align: center;
        }

        .empty-state-icon {
            width: 100px;
            height: 100px;
            background: #f0f4f8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            position: relative;
        }

        .empty-state-icon svg {
            width: 50px;
            height: 50px;
            color: #9ca3af;
        }

        .icon-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            background: #4285f4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .empty-state-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin: 0 0 8px 0;
        }

        .empty-state-subtitle {
            font-size: 14px;
            color: #666;
            margin: 0 0 24px 0;
            max-width: 500px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn-create {
            padding: 10px 20px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-create:hover {
            background: #3367d6;
        }

        .btn-import {
            padding: 10px 20px;
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-import:hover {
            background: #f5f5f5;
        }

        .divider {
            color: #999;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .import-using {
            font-size: 13px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .import-using a {
            color: #4285f4;
            text-decoration: none;
        }

        .import-using a:hover {
            text-decoration: underline;
        }

        /* Vendors Table */
        .vendors-container {
            padding: 24px;
        }

        .vendors-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .vendors-table th {
            text-align: left;
            padding: 14px 16px;
            font-size: 11px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e9ecef;
            background: #f9fafb;
        }

        .vendors-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            color: #333;
        }
    </style>
</head>

<body>
    <!-- Sidebar Container -->
    <div id="sidebarContainer"></div>

    <div class="main-layout">
        <div class="content" id="content">
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-title-wrapper">
                    <h1 class="page-title">
                        All Vendors
                        <span class="dropdown-arrow">▼</span>
                    </h1>
                </div>
                <div class="header-actions">
                    <div class="btn-new-group">
                        <button class="btn-new" onclick="createNewVendor()">
                            <span>+</span> New
                        </button>
                        <button class="btn-new-dropdown">▼</button>
                    </div>
                    <button class="btn-more">⋯</button>
                </div>
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span class="icon-badge">+</span>
                </div>
                <h2 class="empty-state-title">Every purchase starts with a vendor</h2>
                <p class="empty-state-subtitle">Create and manage your vendors and their contact persons, all in one
                    place.</p>
                <div class="button-group">
                    <button class="btn-create" onclick="createNewVendor()">
                        <span>+</span> Create New Vendor
                    </button>
                    <button class="btn-import" onclick="importVendors()">
                        📥 Import File
                    </button>
                </div>
                <div class="divider">- or -</div>
                <div class="import-using">
                    Import using <a href="#">📊</a>
                </div>
            </div>

            <!-- Vendors Container (hidden when empty) -->
            <div class="vendors-container" id="vendorsContainer" style="display: none;">
                <table class="vendors-table">
                    <thead>
                        <tr>
                            <th>NAME</th>
                            <th>COMPANY NAME</th>
                            <th>EMAIL</th>
                            <th>WORK PHONE</th>
                            <th>PAYABLES</th>
                        </tr>
                    </thead>
                    <tbody id="vendorsBody">
                        <!-- Vendors will be added here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Layout Script -->
    <script src="/js/layout.js"></script>
    <script>
        // Create new vendor
        function createNewVendor() {
            window.location.href = '/new-vendor.html';
        }

        // Import vendors
        function importVendors() {
            window.location.href = '/import-vendors.html';
        }
    </script>
</body>

</html>
