<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Shipments - Inventory Management</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', 'Source Sans Pro', Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f6fa;
            font-size: 13px;
        }

        /* Main Content */
        .main-layout {
            display: flex;
            min-height: 100vh;
        }

        .content {
            flex: 1;
            margin-left: 260px;
            padding: 0;
            background: white;
        }

        /* Page Header */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: white;
            border-bottom: 1px solid #e9ecef;
        }

        .page-title-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .page-title:hover {
            color: #4285f4;
        }

        .dropdown-arrow {
            font-size: 10px;
            color: #666;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .easypost-link {
            color: #4285f4;
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .easypost-link:hover {
            text-decoration: underline;
        }

        .easypost-link .brand {
            font-weight: 600;
            color: #333;
        }

        .btn-new-group {
            display: flex;
            align-items: stretch;
        }

        .btn-new {
            padding: 8px 16px;
            background: #4ade80;
            color: white;
            border: none;
            border-radius: 6px 0 0 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-new:hover {
            background: #22c55e;
        }

        .btn-new-dropdown {
            padding: 8px 10px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            border-left: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-new-dropdown:hover {
            background: #16a34a;
        }

        .btn-more {
            width: 36px;
            height: 36px;
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-more:hover {
            background: #f5f5f5;
        }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: #f9fafb;
            border-bottom: 1px solid #e9ecef;
        }

        .filter-label {
            font-size: 13px;
            color: #666;
        }

        .filter-select {
            padding: 6px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
            background: white;
            cursor: pointer;
        }

        .filter-select:focus {
            outline: none;
            border-color: #4285f4;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 120px 24px;
            text-align: center;
        }

        .empty-state-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin: 0 0 12px 0;
        }

        .empty-state-subtitle {
            font-size: 14px;
            color: #666;
            margin: 0 0 32px 0;
            max-width: 400px;
        }

        .btn-create {
            padding: 12px 24px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-create:hover {
            background: #3367d6;
        }

        /* Shipments Table (for when there are records) */
        .shipments-container {
            padding: 24px;
        }

        .shipments-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        .shipments-table th {
            text-align: left;
            padding: 14px 16px;
            font-size: 11px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e9ecef;
            background: #f9fafb;
        }

        .shipments-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            color: #333;
        }
    </style>
</head>

<body>
    <!-- Sidebar Container -->
    <div id="sidebarContainer"></div>

    <div class="main-layout">
        <div class="content" id="content">
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-title-wrapper">
                    <h1 class="page-title">
                        All Shipments
                        <span class="dropdown-arrow">▼</span>
                    </h1>
                </div>
                <div class="header-actions">
                    <a href="#" class="easypost-link">
                        View EasyPost Usage <span class="brand">easypost.</span>
                    </a>
                    <div class="btn-new-group">
                        <button class="btn-new" onclick="createShipment()">
                            <span>+</span> New
                        </button>
                        <button class="btn-new-dropdown">▼</button>
                    </div>
                    <button class="btn-more">⋯</button>
                </div>
            </div>

            <!-- Filter Bar -->
            <div class="filter-bar">
                <span class="filter-label">Filter By :</span>
                <select class="filter-select" id="typeFilter">
                    <option value="all">Type: All</option>
                    <option value="pending">Pending</option>
                    <option value="shipped">Shipped</option>
                    <option value="delivered">Delivered</option>
                </select>
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <h2 class="empty-state-title">Ship with Confidence and Accuracy</h2>
                <p class="empty-state-subtitle">Create shipment records and track delivery status for your orders.</p>
                <button class="btn-create" onclick="createShipment()">CREATE SHIPMENT</button>
            </div>

            <!-- Shipments Container (hidden when empty) -->
            <div class="shipments-container" id="shipmentsContainer" style="display: none;">
                <table class="shipments-table">
                    <thead>
                        <tr>
                            <th>SHIPMENT#</th>
                            <th>DATE</th>
                            <th>PACKAGE</th>
                            <th>CARRIER</th>
                            <th>TRACKING#</th>
                            <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="shipmentsBody">
                        <!-- Shipments will be added here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Layout Script -->
    <script src="/js/layout.js"></script>
    <script>
        // Create new shipment
        function createShipment() {
            window.location.href = '/new-shipment.html';
        }

        // Filter change handler
        document.getElementById('typeFilter').addEventListener('change', function () {
            // Filter logic here
            console.log('Filter changed to:', this.value);
        });
    </script>
</body>

</html>
