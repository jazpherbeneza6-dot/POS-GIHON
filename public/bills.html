<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bills - Inventory Management</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', 'Source Sans Pro', Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f6fa;
            font-size: 13px;
        }

        .main-layout {
            display: flex;
            min-height: 100vh;
        }

        .content {
            flex: 1;
            margin-left: 260px;
            padding: 0;
            background: white;
        }

        /* Page Header */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: white;
            border-bottom: 1px solid #e9ecef;
        }

        .page-title-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .page-title:hover {
            color: #4285f4;
        }

        .dropdown-arrow {
            font-size: 10px;
            color: #666;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .view-toggle {
            display: flex;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .view-btn {
            width: 36px;
            height: 32px;
            background: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
        }

        .view-btn:first-child {
            border-right: 1px solid #e0e0e0;
        }

        .view-btn:hover {
            background: #f5f5f5;
        }

        .view-btn.active {
            background: #e8f0fe;
            color: #4285f4;
        }

        .btn-new-group {
            display: flex;
        }

        .btn-new {
            padding: 8px 16px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px 0 0 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-new:hover {
            background: #3367d6;
        }

        .btn-new-dropdown {
            padding: 8px 10px;
            background: #3367d6;
            color: white;
            border: none;
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 10px;
        }

        .btn-new-dropdown:hover {
            background: #2d5bb9;
        }

        .btn-more {
            width: 36px;
            height: 36px;
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-more:hover {
            background: #f5f5f5;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 150px 24px;
            text-align: center;
        }

        .empty-state-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin: 0 0 12px 0;
        }

        .empty-state-subtitle {
            font-size: 14px;
            color: #666;
            margin: 0 0 28px 0;
            max-width: 600px;
            line-height: 1.5;
        }

        .btn-create {
            padding: 12px 28px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .btn-create:hover {
            background: #3367d6;
        }

        .import-link {
            color: #4285f4;
            text-decoration: none;
            font-size: 14px;
        }

        .import-link:hover {
            text-decoration: underline;
        }

        /* Bills Table */
        .bills-container {
            padding: 24px;
        }

        .bills-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .bills-table th {
            text-align: left;
            padding: 14px 16px;
            font-size: 11px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e9ecef;
            background: #f9fafb;
        }

        .bills-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            color: #333;
        }
    </style>
</head>

<body>
    <!-- Sidebar Container -->
    <div id="sidebarContainer"></div>

    <div class="main-layout">
        <div class="content" id="content">
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-title-wrapper">
                    <h1 class="page-title">
                        All Bills
                        <span class="dropdown-arrow">▼</span>
                    </h1>
                </div>
                <div class="header-actions">
                    <div class="view-toggle">
                        <button class="view-btn active" title="List View">☰</button>
                        <button class="view-btn" title="Grid View">⊞</button>
                    </div>
                    <div class="btn-new-group">
                        <button class="btn-new" onclick="createBill()">
                            <span>+</span> New
                        </button>
                        <button class="btn-new-dropdown">▼</button>
                    </div>
                    <button class="btn-more">⋯</button>
                </div>
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <h2 class="empty-state-title">Owe money? It's good to pay bills on time!</h2>
                <p class="empty-state-subtitle">If you've purchased something for your business, and you don't have to
                    repay it immediately, then you can record it as a bill.</p>
                <button class="btn-create" onclick="createBill()">CREATE A BILL</button>
                <a href="/import-bills.html" class="import-link">Import Bills</a>
            </div>

            <!-- Bills Container (hidden when empty) -->
            <div class="bills-container" id="billsContainer" style="display: none;">
                <table class="bills-table">
                    <thead>
                        <tr>
                            <th>DATE</th>
                            <th>BILL#</th>
                            <th>ORDER NUMBER</th>
                            <th>VENDOR NAME</th>
                            <th>STATUS</th>
                            <th>DUE DATE</th>
                            <th>AMOUNT</th>
                            <th>BALANCE DUE</th>
                        </tr>
                    </thead>
                    <tbody id="billsBody">
                        <!-- Bills will be added here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Layout Script -->
    <script src="/js/layout.js"></script>
    <script>
        function createBill() {
            window.location.href = '/new-bill.html';
        }

        document.addEventListener('DOMContentLoaded', loadBills);

        async function loadBills() {
            try {
                const res = await fetch('/api/bills');
                if (!res.ok) return;
                const bills = await res.json();

                if (bills.length === 0) {
                    document.getElementById('emptyState').style.display = 'flex';
                    document.getElementById('billsContainer').style.display = 'none';
                    return;
                }

                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('billsContainer').style.display = 'block';

                const tbody = document.getElementById('billsBody');
                tbody.innerHTML = '';

                bills.forEach(bill => {
                    const tr = document.createElement('tr');
                    tr.style.cursor = 'pointer';

                    const billDate = bill.bill_date ? new Date(bill.bill_date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '-';
                    const dueDate = bill.due_date ? new Date(bill.due_date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '-';
                    const amount = parseFloat(bill.total_amount) || 0;
                    const status = (bill.status || 'draft').toUpperCase();

                    let statusColor = '#6b7280';
                    let statusBg = '#f3f4f6';
                    if (status === 'OPEN') { statusColor = '#16a34a'; statusBg = '#dcfce7'; }
                    else if (status === 'PAID') { statusColor = '#2563eb'; statusBg = '#dbeafe'; }
                    else if (status === 'OVERDUE') { statusColor = '#dc2626'; statusBg = '#fef2f2'; }

                    tr.innerHTML = `
                        <td>${billDate}</td>
                        <td style="color:#4285f4;font-weight:500;">${bill.bill_number || '-'}</td>
                        <td>${bill.order_number || '-'}</td>
                        <td>${bill.supplier_name || '-'}</td>
                        <td><span style="padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;color:${statusColor};background:${statusBg};">${status}</span></td>
                        <td>${dueDate}</td>
                        <td style="font-weight:500;">₱${amount.toFixed(2)}</td>
                        <td style="font-weight:500;">₱${amount.toFixed(2)}</td>
                    `;
                    tr.addEventListener('click', () => { window.location.href = '/bill-detail.html?id=' + bill.id; });
                    tr.addEventListener('mouseenter', () => { tr.style.background = '#f5f8ff'; });
                    tr.addEventListener('mouseleave', () => { tr.style.background = ''; });
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error('Error loading bills:', e);
            }
        }
    </script>
</body>

</html>
