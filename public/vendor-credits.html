<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Credits - Inventory Management</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', 'Source Sans Pro', Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f6fa;
            font-size: 13px;
        }

        .main-layout {
            display: flex;
            min-height: 100vh;
        }

        .content {
            flex: 1;
            margin-left: 260px;
            padding: 0;
            background: white;
        }

        /* Page Header */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: white;
            border-bottom: 1px solid #e9ecef;
        }

        .page-title-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .page-title:hover {
            color: #4285f4;
        }

        .dropdown-arrow {
            font-size: 10px;
            color: #666;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-new-group {
            display: flex;
        }

        .btn-new {
            padding: 8px 16px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px 0 0 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-new:hover {
            background: #3367d6;
        }

        .btn-new-dropdown {
            padding: 8px 10px;
            background: #3367d6;
            color: white;
            border: none;
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 10px;
        }

        .btn-new-dropdown:hover {
            background: #2d5bb9;
        }

        .btn-more {
            width: 36px;
            height: 36px;
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-more:hover {
            background: #f5f5f5;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 150px 24px;
            text-align: center;
        }

        .empty-state-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin: 0 0 12px 0;
        }

        .empty-state-subtitle {
            font-size: 14px;
            color: #666;
            margin: 0 0 28px 0;
            max-width: 400px;
            line-height: 1.5;
        }

        .btn-create {
            padding: 12px 28px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-create:hover {
            background: #3367d6;
        }

        /* Credits Table */
        .credits-container {
            padding: 24px;
        }

        .credits-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .credits-table th {
            text-align: left;
            padding: 14px 16px;
            font-size: 11px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e9ecef;
            background: #f9fafb;
        }

        .credits-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            color: #333;
        }

        .credits-table tr {
            cursor: pointer;
            transition: background 0.15s;
        }

        .credits-table tbody tr:hover {
            background: #f5f8ff;
        }

        .status-badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-draft {
            color: #92400e;
            background: #fef3c7;
        }

        .status-open {
            color: #1e40af;
            background: #dbeafe;
        }

        .link-blue {
            color: #4285f4;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div id="sidebarContainer"></div>

    <div class="main-layout">
        <div class="content" id="content">
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-title-wrapper">
                    <h1 class="page-title">
                        All Vendor Credits
                        <span class="dropdown-arrow">▼</span>
                    </h1>
                </div>
                <div class="header-actions">
                    <div class="btn-new-group">
                        <button class="btn-new" onclick="window.location.href='/new-vendor-credit.html'">
                            <span>+</span> New
                        </button>
                        <button class="btn-new-dropdown">▼</button>
                    </div>
                    <button class="btn-more">⋯</button>
                </div>
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <h2 class="empty-state-title">No Vendor Credits yet.</h2>
                <p class="empty-state-subtitle">Vendor credits you create from your bills will appear here.</p>
                <button class="btn-create" onclick="window.location.href='/bills.html'">GO TO BILLS</button>
            </div>

            <!-- Credits Table -->
            <div class="credits-container" id="creditsContainer" style="display: none;">
                <table class="credits-table">
                    <thead>
                        <tr>
                            <th>DATE</th>
                            <th>CREDIT NOTE#</th>
                            <th>REFERENCE#</th>
                            <th>VENDOR NAME</th>
                            <th>STATUS</th>
                            <th style="text-align:right;">AMOUNT</th>
                        </tr>
                    </thead>
                    <tbody id="creditsBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/layout.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadCredits);

        async function loadCredits() {
            try {
                const res = await fetch('/api/vendor-credits');
                if (!res.ok) return;
                const credits = await res.json();

                if (credits.length === 0) {
                    document.getElementById('emptyState').style.display = 'flex';
                    document.getElementById('creditsContainer').style.display = 'none';
                    return;
                }

                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('creditsContainer').style.display = 'block';

                const tbody = document.getElementById('creditsBody');
                tbody.innerHTML = '';

                credits.forEach(c => {
                    const tr = document.createElement('tr');
                    tr.onclick = () => { window.location.href = '/vendor-credit-detail.html?id=' + c.id; };

                    const cDate = c.credit_date
                        ? new Date(c.credit_date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
                        : '-';
                    const amount = parseFloat(c.total_amount || 0);
                    const status = (c.status || 'draft').toLowerCase();

                    let statusClass = 'status-draft';
                    let statusLabel = 'DRAFT';
                    if (status === 'open') {
                        statusClass = 'status-open';
                        statusLabel = 'OPEN';
                    }

                    tr.innerHTML = `
                        <td>${cDate}</td>
                        <td class="link-blue">${c.credit_number || '-'}</td>
                        <td>${c.reference || '-'}</td>
                        <td>${c.supplier_name || '-'}</td>
                        <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                        <td style="text-align:right;font-weight:500;">₱${amount.toLocaleString('en-PH', { minimumFractionDigits: 2 })}</td>
                    `;

                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error('Error loading vendor credits:', e);
            }
        }
    </script>
</body>

</html>
