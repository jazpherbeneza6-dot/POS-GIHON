<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profit By Item - Reports</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/report-export.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', 'Source Sans Pro', Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f6fa;
            font-size: 13px;
        }

        .main-layout {
            display: flex;
            min-height: 100vh;
        }

        .content {
            flex: 1;
            margin-left: 260px;
            padding: 0;
            background: #fff;
        }

        /* ===== TOP HEADER BAR ===== */
        .report-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            min-height: 44px;
        }

        .report-top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hamburger-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #555;
            padding: 4px 8px;
        }

        .breadcrumb-area {
            display: flex;
            flex-direction: column;
        }

        .breadcrumb-category {
            font-size: 11px;
            color: #999;
        }

        .breadcrumb-title {
            font-size: 15px;
            font-weight: 600;
            color: #222;
        }

        .breadcrumb-date {
            font-size: 11px;
            color: #999;
            font-weight: 400;
            margin-left: 6px;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-bar-actions button {
            background: none;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 14px;
            color: #555;
        }

        .top-bar-actions button:hover {
            background: #f5f5f5;
        }

        .btn-export {
            font-size: 12px !important;
            font-weight: 500;
        }

        .btn-close-report {
            color: #e53935 !important;
            font-weight: bold;
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            background: #f9fafb;
            border-bottom: 1px solid #e8e8e8;
        }

        .filter-label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
        }

        .filter-dropdown {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 12px;
            color: #333;
        }

        .filter-dropdown select {
            border: none;
            outline: none;
            font-size: 12px;
            color: #2563eb;
            font-weight: 500;
            cursor: pointer;
            background: transparent;
        }

        .filter-more {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 5px 12px;
            font-size: 12px;
            color: #2563eb;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-run-report {
            background: #e53935;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 7px 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-run-report:hover {
            background: #c62828;
        }

        /* ===== OPTIONS BAR ===== */
        .options-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 20px;
            padding: 8px 20px;
            background: #fff;
            border-bottom: 1px solid #eee;
            font-size: 12px;
            color: #555;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .option-bold {
            font-weight: 600;
            color: #333;
        }

        .option-icon {
            font-size: 14px;
        }

        .customize-count {
            background: #2563eb;
            color: #fff;
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 10px;
            font-weight: 700;
            margin-left: 4px;
        }

        /* ===== REPORT BODY ===== */
        .report-body {
            padding: 30px 40px 60px;
        }

        .report-header-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .company-name {
            font-size: 13px;
            color: #888;
            margin-bottom: 4px;
        }

        .report-main-title {
            font-size: 17px;
            font-weight: 700;
            color: #222;
        }

        .report-date-range {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }

        .date-highlight {
            color: #2563eb;
            font-weight: 500;
        }

        /* ===== REPORT TABLE ===== */
        .report-table-wrapper {
            overflow-x: auto;
        }

        .report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .report-table thead th {
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            padding: 10px 12px;
            border-bottom: 2px solid #ddd;
            background: #fafafa;
            white-space: nowrap;
        }

        .report-table tbody td {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }

        .report-table tfoot td {
            padding: 10px 12px;
            font-weight: 700;
            border-top: 2px solid #ddd;
            background: #fafafa;
            color: #222;
        }

        .report-table tbody tr:hover {
            background: #f8f9ff;
        }

        .align-right {
            text-align: right !important;
        }

        .align-center {
            text-align: center !important;
        }

        .item-link {
            color: #2563eb;
            cursor: pointer;
        }

        .item-link:hover {
            text-decoration: underline;
        }

        .sort-icon {
            font-size: 10px;
            color: #bbb;
            margin-left: 4px;
        }

        .currency-amount {
            color: #e67e22;
        }

        .margin-positive {
            color: #16a34a;
            font-weight: 600;
        }

        .margin-negative {
            color: #e53935;
            font-weight: 600;
        }

        .margin-info {
            font-size: 10px;
            color: #999;
            cursor: help;
        }
    </style>
</head>

<body>
    <div id="sidebarContainer"></div>

    <div class="main-layout">
        <div class="content" id="content">

            <!-- TOP HEADER BAR -->
            <div class="report-top-bar">
                <div class="report-top-left">
                    <button class="hamburger-btn" onclick="window.location.href='/reports.html'">☰</button>
                    <div class="breadcrumb-area">
                        <span class="breadcrumb-category" id="breadcrumbCategory">Sales</span>
                        <span class="breadcrumb-title">
                            <span id="breadcrumbTitleText">Profit By Item</span>
                            <span class="breadcrumb-date" id="breadcrumbDate">•</span>
                        </span>
                    </div>
                </div>
                <div class="top-bar-actions">
                    <button title="Schedule"><span>📅</span></button>
                    <button title="Refresh" onclick="runReport()"><span>🔄</span></button>
                    <button title="Share"><span>📤</span></button>
                    <button class="btn-export" title="Export">Export ▾</button>
                    <button title="Print" onclick="window.print()"><span>🖨</span></button>
                    <button class="btn-close-report" title="Close"
                        onclick="window.location.href='/reports.html'">✕</button>
                </div>
            </div>

            <!-- FILTER BAR -->
            <div class="filter-bar">
                <span class="filter-label">🔽 Filters :</span>

                <div class="filter-dropdown">
                    <span>Date Range :</span>
                    <select id="dateRangeSelect" onchange="handleDateRangeChange()" title="Date Range Filter">
                        <option value="this-month" selected>This Month</option>
                        <option value="last-month">Last Month</option>
                        <option value="this-quarter">This Quarter</option>
                        <option value="this-year">This Year</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>

                <button class="filter-more">⊕ More Filters</button>

                <button class="btn-run-report" onclick="runReport()">Run Report</button>
            </div>

            <!-- OPTIONS BAR -->
            <div class="options-bar">
                <div class="option-item">
                    <span class="option-icon">⚙️</span>
                    Customize Report Columns
                    <span class="customize-count">6</span>
                </div>
            </div>

            <!-- REPORT BODY -->
            <div class="report-body">
                <div class="report-header-section">
                    <div class="company-name">SOLO</div>
                    <div class="report-main-title" id="reportMainTitle">Profit By Item</div>
                    <div class="report-date-range" id="reportDateRange">
                        From <span class="date-highlight" id="fromDateDisplay">-</span> To <span class="date-highlight"
                            id="toDateDisplay">-</span>
                    </div>
                </div>

                <div class="report-table-wrapper">
                    <table class="report-table">
                        <thead id="reportTableHead">
                            <tr>
                                <th>ITEM NAME <span class="sort-icon">⇅</span></th>
                                <th>SKU</th>
                                <th class="align-center">MARGIN <span class="margin-info"
                                        title="Margin = (Sales - Cost) / Sales × 100">ⓘ</span></th>
                                <th class="align-right">QTY SOLD</th>
                                <th class="align-right">TOTAL SALES</th>
                                <th class="align-right">TOTAL SALES WITH TAX</th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody">
                            <tr>
                                <td colspan="6" class="align-center" style="padding:40px; color:#999;">Loading...</td>
                            </tr>
                        </tbody>
                        <tfoot id="reportTableFoot" style="display:none;">
                            <tr>
                                <td>Total</td>
                                <td></td>
                                <td></td>
                                <td class="align-right" id="totalQtySold"></td>
                                <td class="align-right" id="totalSales"></td>
                                <td class="align-right" id="totalSalesWithTax"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="/js/layout.js"></script>
    <script src="/js/report-export.js"></script>
    <script>
        let currentFrom = '';
        let currentTo = '';

        document.addEventListener('DOMContentLoaded', () => {
            setThisMonth();
            runReport();
        });

        function setThisMonth() {
            const now = new Date();
            const y = now.getFullYear();
            const m = now.getMonth();
            currentFrom = new Date(y, m, 1).toISOString().split('T')[0];
            currentTo = new Date(y, m + 1, 0).toISOString().split('T')[0];
            updateDateDisplays();
        }

        function handleDateRangeChange() {
            const v = document.getElementById('dateRangeSelect').value;
            const now = new Date();
            const y = now.getFullYear();
            const m = now.getMonth();

            switch (v) {
                case 'this-month':
                    currentFrom = new Date(y, m, 1).toISOString().split('T')[0];
                    currentTo = new Date(y, m + 1, 0).toISOString().split('T')[0];
                    break;
                case 'last-month':
                    currentFrom = new Date(y, m - 1, 1).toISOString().split('T')[0];
                    currentTo = new Date(y, m, 0).toISOString().split('T')[0];
                    break;
                case 'this-quarter':
                    const qStart = Math.floor(m / 3) * 3;
                    currentFrom = new Date(y, qStart, 1).toISOString().split('T')[0];
                    currentTo = new Date(y, qStart + 3, 0).toISOString().split('T')[0];
                    break;
                case 'this-year':
                    currentFrom = new Date(y, 0, 1).toISOString().split('T')[0];
                    currentTo = new Date(y, 11, 31).toISOString().split('T')[0];
                    break;
                case 'custom':
                    break;
            }
            updateDateDisplays();
            runReport();
        }

        function updateDateDisplays() {
            const fmt = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            const fromStr = currentFrom ? fmt(currentFrom) : '-';
            const toStr = currentTo ? fmt(currentTo) : '-';

            document.getElementById('fromDateDisplay').textContent = fromStr;
            document.getElementById('toDateDisplay').textContent = toStr;
            document.getElementById('breadcrumbDate').textContent = `• From ${fromStr} To ${toStr}`;
        }

        function fmtCurrency(val) {
            const num = parseFloat(val);
            const prefix = num < 0 ? 'PHP-' : 'PHP';
            return prefix + Math.abs(num).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function fmtNum(val) {
            return parseFloat(val).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function getMarginClass(margin) {
            if (margin < 0) return 'margin-negative';
            return 'margin-positive';
        }

        // ===== MAIN REPORT =====
        async function runReport() {
            const tbody = document.getElementById('reportTableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="align-center" style="padding:40px;color:#999;">Loading...</td></tr>';
            document.getElementById('reportTableFoot').style.display = 'none';

            try {
                let url = '/api/sales/reports/profit-by-item';
                if (currentFrom && currentTo) {
                    url += `?from=${currentFrom}&to=${currentTo}`;
                }
                const res = await fetch(url);
                if (!res.ok) throw new Error('API error');
                const data = await res.json();

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="align-center" style="padding:60px;color:#999;font-size:14px;">No sales data found for the selected period.</td></tr>';
                    return;
                }

                let tQtySold = 0, tSales = 0, tSalesTax = 0;

                tbody.innerHTML = data.map(item => {
                    const margin = parseFloat(item.margin) || 0;
                    const qtySold = parseFloat(item.qty_sold) || 0;
                    const totalSales = parseFloat(item.total_sales) || 0;
                    const totalSalesWithTax = parseFloat(item.total_sales_with_tax) || 0;

                    tQtySold += qtySold;
                    tSales += totalSales;
                    tSalesTax += totalSalesWithTax;

                    return `
                        <tr>
                            <td class="item-link">${item.item_name}</td>
                            <td>${item.sku || ''}</td>
                            <td class="align-center ${getMarginClass(margin)}">${margin.toFixed(2)}%</td>
                            <td class="align-right">${fmtNum(qtySold)}</td>
                            <td class="align-right currency-amount">${fmtCurrency(totalSales)}</td>
                            <td class="align-right currency-amount">${fmtCurrency(totalSalesWithTax)}</td>
                        </tr>
                    `;
                }).join('');

                // Update totals
                document.getElementById('totalQtySold').textContent = fmtNum(tQtySold);
                document.getElementById('totalSales').textContent = fmtCurrency(tSales);
                document.getElementById('totalSalesWithTax').textContent = fmtCurrency(tSalesTax);
                document.getElementById('reportTableFoot').style.display = '';

            } catch (e) {
                console.error('Error:', e);
                tbody.innerHTML = '<tr><td colspan="6" class="align-center" style="padding:40px;color:#e53935;">Error loading report data.</td></tr>';
            }
        }
    </script>
</body>

</html>
