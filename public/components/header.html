<!-- Header Component -->
<div class="header">
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    <div class="header-left">

    </div>
    <div class="header-right">
        <div id="headerActions"></div>
        <div class="header-icon notification-icon" id="headerNotificationIcon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span id="notificationBadge" class="notification-badge" style="display:none">0</span>
        </div>

    </div>
</div>

<!-- Notification Overlay -->
<div id="notificationOverlay" class="notification-overlay" onclick="toggleNotificationPanel()"></div>

<!-- Notification Panel -->
<div id="notificationPanel" class="notification-panel">
    <div class="notification-panel-header">
        <h3>🔔 Notifications kulogs </h3>
        <button onclick="toggleNotificationPanel()">×</button>
    </div>
    <div class="notification-list" id="notificationList">
        <div class="no-notifications">
            <span>🔔</span>
            <p>No notifications yet</p>
        </div>
    </div>
</div>
