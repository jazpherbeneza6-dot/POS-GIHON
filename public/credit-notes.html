<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Notes - Inventory Management</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', 'Source Sans Pro', Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f6fa;
            font-size: 13px;
        }

        .main-layout {
            display: flex;
            min-height: 100vh;
        }

        .content {
            flex: 1;
            margin-left: 260px;
            padding: 0;
            background: white;
        }

        /* Page Header */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: white;
            border-bottom: 1px solid #e9ecef;
        }

        .page-title-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .page-title:hover {
            color: #4285f4;
        }

        .dropdown-arrow {
            font-size: 10px;
            color: #666;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-new-group {
            display: flex;
        }

        .btn-new {
            padding: 8px 16px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px 0 0 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-new:hover {
            background: #3367d6;
        }

        .btn-new-dropdown {
            padding: 8px 10px;
            background: #3367d6;
            color: white;
            border: none;
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 10px;
        }

        .btn-new-dropdown:hover {
            background: #2d5bb9;
        }

        .btn-more {
            width: 36px;
            height: 36px;
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-more:hover {
            background: #f5f5f5;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 150px 24px;
            text-align: center;
        }

        .btn-create {
            padding: 12px 28px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .btn-create:hover {
            background: #3367d6;
        }

        .import-link {
            color: #4285f4;
            text-decoration: none;
            font-size: 14px;
        }

        .import-link:hover {
            text-decoration: underline;
        }

        /* Credit Notes Table */
        .notes-container {
            padding: 24px;
        }

        .notes-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .notes-table th {
            text-align: left;
            padding: 14px 16px;
            font-size: 11px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e9ecef;
            background: #f9fafb;
        }

        .notes-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            color: #333;
        }
    </style>
</head>

<body>
    <!-- Sidebar Container -->
    <div id="sidebarContainer"></div>

    <div class="main-layout">
        <div class="content" id="content">
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-title-wrapper">
                    <h1 class="page-title">
                        All Credit Notes
                        <span class="dropdown-arrow">▼</span>
                    </h1>
                </div>
                <div class="header-actions">
                    <div class="btn-new-group">
                        <button class="btn-new" onclick="createCreditNote()">
                            <span>+</span> New
                        </button>
                        <button class="btn-new-dropdown">▼</button>
                    </div>
                    <button class="btn-more">⋯</button>
                </div>
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <button class="btn-create" onclick="createCreditNote()">CREATE NEW CREDIT NOTE</button>
                <a href="/import-credit-notes.html" class="import-link">Import Credit Notes</a>
            </div>

            <!-- Credit Notes Container (hidden when empty) -->
            <div class="notes-container" id="notesContainer" style="display: none;">
                <table class="notes-table">
                    <thead>
                        <tr>
                            <th>DATE</th>
                            <th>CREDIT NOTE#</th>
                            <th>REFERENCE#</th>
                            <th>CUSTOMER NAME</th>
                            <th>STATUS</th>
                            <th>AMOUNT</th>
                            <th>BALANCE</th>
                        </tr>
                    </thead>
                    <tbody id="notesBody">
                        <!-- Credit Notes will be added here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Layout Script -->
    <script src="/js/layout.js"></script>
    <script>
        // Create new credit note
        function createCreditNote() {
            window.location.href = '/new-credit-note.html';
        }
    </script>
</body>

</html>
