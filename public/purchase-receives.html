<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Receives - Inventory Management</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', 'Source Sans Pro', Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f6fa;
            font-size: 13px;
        }

        .main-layout {
            display: flex;
            min-height: 100vh;
        }

        .content {
            flex: 1;
            margin-left: 260px;
            padding: 0;
            background: white;
        }

        /* Page Header */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: white;
            border-bottom: 1px solid #e9ecef;
        }

        .page-title-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .page-title:hover {
            color: #4285f4;
        }

        .dropdown-arrow {
            font-size: 10px;
            color: #666;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-new-group {
            display: flex;
        }

        .btn-new {
            padding: 8px 16px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px 0 0 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-new:hover {
            background: #3367d6;
        }

        .btn-new-dropdown {
            padding: 8px 10px;
            background: #3367d6;
            color: white;
            border: none;
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 10px;
        }

        .btn-new-dropdown:hover {
            background: #2d5bb9;
        }

        .btn-more {
            width: 36px;
            height: 36px;
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-more:hover {
            background: #f5f5f5;
        }

        /* Filter Dropdown */
        .filter-dropdown {
            position: relative;
            display: inline-block;
        }

        .filter-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            min-width: 200px;
            z-index: 100;
            margin-top: 4px;
            overflow: hidden;
        }

        .filter-menu.show {
            display: block;
        }

        .filter-menu-item {
            padding: 10px 16px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
        }

        .filter-menu-item:hover {
            background: #f5f7fa;
        }

        .filter-menu-item.active {
            background: #e8f0fe;
            color: #4285f4;
            font-weight: 500;
        }

        .filter-menu-item .star-icon {
            color: #ccc;
            font-size: 14px;
        }

        .filter-menu-item:hover .star-icon {
            color: #bbb;
        }

        .filter-menu-footer {
            padding: 10px 16px;
            font-size: 13px;
            color: #4285f4;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            border-top: 1px solid #e9ecef;
        }

        .filter-menu-footer:hover {
            background: #f5f7fa;
        }

        /* Table Container */
        .table-container {
            padding: 0;
        }

        /* Receives Table */
        .receives-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .receives-table th {
            text-align: left;
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e9ecef;
            background: #f9fafb;
        }

        .receives-table th:first-child {
            padding-left: 24px;
        }

        .receives-table th svg {
            width: 14px;
            height: 14px;
            vertical-align: middle;
            margin-right: 6px;
        }

        .receives-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            color: #333;
        }

        .receives-table td:first-child {
            padding-left: 24px;
        }

        /* Sort Icon */
        .sort-icon {
            color: #999;
            margin-left: 4px;
            font-size: 10px;
        }

        /* Empty State */
        .empty-message {
            padding: 60px 24px;
            text-align: center;
            color: #4285f4;
            font-size: 14px;
        }

        /* Refresh Icon */
        .refresh-icon {
            color: #999;
            cursor: pointer;
            font-size: 14px;
        }

        .refresh-icon:hover {
            color: #333;
        }

        /* Status Badges */
        .status-badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .status-received {
            background: #e6f4ea;
            color: #137333;
        }

        .status-draft {
            background: #fef7e0;
            color: #b06000;
        }

        .status-in-transit {
            background: #e8f0fe;
            color: #1a73e8;
        }

        /* Row hover */
        .receives-table tr:hover td {
            background: #f8f9fa;
            cursor: pointer;
        }

        .receive-link {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
        }

        .receive-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <!-- Sidebar Container -->
    <div id="sidebarContainer"></div>

    <div class="main-layout">
        <div class="content" id="content">
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-title-wrapper">
                    <div class="filter-dropdown">
                        <h1 class="page-title" onclick="toggleFilterMenu()">
                            <span id="filterTitle">All</span>
                            <span class="dropdown-arrow" id="filterArrow">▲</span>
                        </h1>
                        <div class="filter-menu" id="filterMenu">
                            <a href="#" class="filter-menu-item active" onclick="setFilter('all', event)">All <span
                                    class="star-icon">☆</span></a>
                            <a href="#" class="filter-menu-item" onclick="setFilter('in-transit', event)">In
                                Transit <span class="star-icon">☆</span></a>
                            <a href="#" class="filter-menu-item" onclick="setFilter('received', event)">Received <span
                                    class="star-icon">☆</span></a>
                            <a href="#" class="filter-menu-item" onclick="setFilter('billed', event)">Billed <span
                                    class="star-icon">☆</span></a>
                            <a href="#" class="filter-menu-item"
                                onclick="setFilter('partially-billed', event)">Partially Billed <span
                                    class="star-icon">☆</span></a>
                            <div class="filter-menu-footer" onclick="alert('Custom view feature coming soon!')">
                                <span style="color:#4285f4;font-weight:600;">⊕</span> New Custom View
                            </div>
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <div class="btn-new-group">
                        <button class="btn-new" onclick="createNewReceive()">
                            <span>+</span> New
                        </button>
                        <button class="btn-new-dropdown">▼</button>
                    </div>
                    <button class="btn-more">⋯</button>
                </div>
            </div>

            <!-- Table Container -->
            <div class="table-container">
                <table class="receives-table">
                    <thead>
                        <tr>
                            <th>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 6h16M4 12h16M4 18h16" />
                                </svg>
                                DATE <span class="sort-icon">↑</span>
                            </th>
                            <th>PURCHASE RECEIVE#</th>
                            <th>PURCHASE ORDER#</th>
                            <th>VENDOR NAME</th>
                            <th>STATUS</th>
                            <th>BILLED</th>
                            <th>QUANTITY</th>
                            <th><span class="refresh-icon" onclick="refreshData()"><svg width="14" height="14"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="23 4 23 10 17 10" />
                                        <polyline points="1 20 1 14 7 14" />
                                        <path
                                            d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                                    </svg></span></th>
                        </tr>
                    </thead>
                    <tbody id="receivesBody">
                        <!-- Receives will be added here -->
                    </tbody>
                </table>

                <!-- Empty State -->
                <div class="empty-message" id="emptyMessage">
                    No Purchase Receives to display!
                </div>
            </div>
        </div>
    </div>

    <!-- Layout Script -->
    <script src="/js/layout.js"></script>
    <script>
        let currentFilter = 'all';
        let allReceives = [];

        function toggleFilterMenu() {
            const menu = document.getElementById('filterMenu');
            const isOpen = menu.classList.contains('show');
            menu.classList.toggle('show');
            document.getElementById('filterArrow').textContent = isOpen ? '▲' : '▼';
        }

        // Close menu when clicking outside
        document.addEventListener('click', function (e) {
            const dropdown = document.querySelector('.filter-dropdown');
            if (!dropdown.contains(e.target)) {
                document.getElementById('filterMenu').classList.remove('show');
                document.getElementById('filterArrow').textContent = '▲';
            }
        });

        function setFilter(filter, e) {
            if (e) e.preventDefault();
            currentFilter = filter;

            // Update active state
            document.querySelectorAll('.filter-menu-item').forEach(item => {
                item.classList.remove('active');
            });
            if (e && e.target.closest) {
                const item = e.target.closest('.filter-menu-item');
                if (item) item.classList.add('active');
            }

            // Update title
            const titles = {
                'all': 'All',
                'in-transit': 'In Transit',
                'received': 'Received',
                'billed': 'Billed',
                'partially-billed': 'Partially Billed'
            };
            document.getElementById('filterTitle').textContent = titles[filter] || filter;

            // Close menu
            document.getElementById('filterMenu').classList.remove('show');
            document.getElementById('filterArrow').textContent = '▲';

            // Re-render with filter
            renderReceives();
        }

        async function loadReceives() {
            try {
                const res = await fetch('/api/purchase-receives');
                if (!res.ok) throw new Error('Failed to fetch');
                allReceives = await res.json();

                // Fetch all bills to check billed status
                let allBills = [];
                try {
                    const billsRes = await fetch('/api/bills');
                    if (billsRes.ok) allBills = await billsRes.json();
                } catch (e) { }

                // Also fetch items count for each receive
                for (let r of allReceives) {
                    // Check if linked PO has any bills
                    r.po_billed = allBills.some(b => b.purchase_order_id === r.purchase_id);

                    try {
                        const itemsRes = await fetch('/api/purchase-receives/' + r.id);
                        if (itemsRes.ok) {
                            const detail = await itemsRes.json();
                            r.items = detail.items || [];
                            r.total_qty = r.items.reduce((sum, item) => sum + (parseFloat(item.quantity_to_receive) || 0), 0);
                        }
                    } catch (e) {
                        r.total_qty = 0;
                    }
                }

                renderReceives();
            } catch (e) {
                console.error('Error loading receives:', e);
                document.getElementById('receivesBody').innerHTML = '';
                document.getElementById('emptyMessage').style.display = 'block';
                document.getElementById('emptyMessage').textContent = 'Failed to load purchase receives.';
            }
        }

        function renderReceives() {
            const tbody = document.getElementById('receivesBody');
            const emptyMessage = document.getElementById('emptyMessage');

            // Filter based on currentFilter
            let filtered = allReceives;
            if (currentFilter === 'received') {
                filtered = allReceives.filter(r => r.status === 'received');
            } else if (currentFilter === 'in-transit') {
                filtered = allReceives.filter(r => r.status === 'draft' || r.status === 'in_transit');
            } else if (currentFilter === 'billed') {
                filtered = allReceives.filter(r => r.po_billed === true);
            } else if (currentFilter === 'partially-billed') {
                filtered = allReceives.filter(r => r.po_billed === true); // same for now
            }

            if (filtered.length === 0) {
                tbody.innerHTML = '';
                emptyMessage.style.display = 'block';
                emptyMessage.textContent = 'No Purchase Receives to display!';
            } else {
                emptyMessage.style.display = 'none';

                let html = '';
                filtered.forEach(r => {
                    const date = r.receive_date ? new Date(r.receive_date).toLocaleDateString('en-US', {
                        year: 'numeric', month: 'short', day: 'numeric'
                    }) : '—';

                    const receiveNum = r.receive_number || '—';
                    const poNum = r.po_number || '—';
                    const vendor = r.supplier_name || '—';
                    const totalQty = r.total_qty || 0;

                    let statusLabel = r.status || 'draft';
                    let statusClass = 'status-draft';
                    if (statusLabel === 'received') {
                        statusClass = 'status-received';
                        statusLabel = 'Received';
                    } else if (statusLabel === 'in_transit') {
                        statusClass = 'status-in-transit';
                        statusLabel = 'In Transit';
                    } else if (statusLabel === 'draft') {
                        statusClass = 'status-draft';
                        statusLabel = 'Draft';
                    }

                    const billedCell = r.po_billed
                        ? '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#4285f4;"></span>'
                        : '-';

                    html += `<tr onclick="viewReceive(${r.id})">
                        <td>${date}</td>
                        <td><a class="receive-link" href="#">${receiveNum}</a></td>
                        <td><a class="receive-link" href="/purchase-order-detail.html?id=${r.purchase_id}">${poNum}</a></td>
                        <td>${vendor}</td>
                        <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                        <td style="text-align:center;">${billedCell}</td>
                        <td>${totalQty}</td>
                        <td></td>
                    </tr>`;
                });

                tbody.innerHTML = html;
            }
        }

        function viewReceive(id) {
            window.location.href = '/purchase-receive-detail.html?id=' + id;
        }

        function createNewReceive() {
            window.location.href = '/new-purchase-receive.html';
        }

        function refreshData() {
            loadReceives();
        }

        // Initial load
        loadReceives();
    </script>
</body>

</html>
